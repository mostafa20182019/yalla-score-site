name: Publish Yalla Score

# Runs on GitHub's servers (free, no PC needed). Fetches latest news + matches,
# rebuilds the static site, and deploys it to Cloudflare.
on:
  push:
    branches: [ main ]           # deploy on every push (also forces GitHub to register the workflow)
  schedule:
    - cron: "7,22,37,52 * * * *"  # 4x/hour on off-peak minutes (GitHub cron is best-effort and often delayed/skipped; extra slots = fresher data)
  workflow_dispatch: {}          # allows a manual run from the Actions tab (also fired by the Cloudflare Worker cron)

permissions:
  contents: write                # needed to commit refreshed data/ back to the repo
  actions: write                 # dispatch match-article.yml when a curated-club match needs a preview/report

# Data-refresh runs are interchangeable - only the newest matters - so they
# still cancel each other. A PUSH carries new content (an article), so it gets
# its own group and is never cancelled.
#
# Why: with a single shared group + cancel-in-progress, a trigger fires every
# ~15 min (Worker cron + GitHub cron), so any run slower than that window was
# always cancelled by the next one. During the GitHub Actions outage on
# 2026-08-06, ten consecutive runs were cancelled or failed and article 85
# never deployed - it had to be pushed out by hand with a local wrangler.
concurrency:
  group: publish-${{ github.event_name == 'push' && github.sha || 'refresh' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # fail fast instead of hanging and eating the whole trigger window
    steps:
      # ref: main (not the trigger SHA) makes every run deploy the CURRENT tip
      # of main. That makes the pipeline self-healing: whichever run completes
      # next publishes the newest content, so a cancelled or failed article
      # deploy is picked up automatically by the following refresh run instead
      # of waiting for another push. It also stops a queued run from
      # redeploying a checkout that predates the article and clobbering it.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      # continue-on-error: a dead upstream (Google News / football-data) or a
      # hung fetch must not block publishing content that is already committed.
      # fetch_data.py keeps the previous file per source on failure, so the
      # build below still has usable data - just not newer data.
      - name: Fetch latest content (news + matches)
        continue-on-error: true
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
        run: python fetch_data.py

      - name: Build the static site
        run: python build_site.py

      # Plain npx instead of cloudflare/wrangler-action@v3: the deploy step is
      # the one that must not fail, and every marketplace action is a download
      # that GitHub has to resolve first ("Failed to resolve action download
      # info" is what broke the 2026-08-06 runs). npx pulls from npm, which is
      # a separate dependency from GitHub's action service.
      # wrangler@4 is also new enough for [assets].run_worker_first, which the
      # canonical-host 301 redirect in worker.js depends on - that is why the
      # old wrangler-action needed wranglerVersion: "latest".
      # Stale-checkout guard: if main moved while this run was fetching and
      # building (an article push landing mid-run), deploying now would
      # briefly REVERT the newer content the other run already published -
      # a reader clicking the new hero article hit a bare 404 exactly this
      # way. Skip the deploy; the push that moved main runs its own job and
      # deploys the newer tip. The data commit-back below still runs, so the
      # fetched data isn't wasted.
      #
      # EXCEPTION (2026-08-28): a "data refresh" commit-back carries
      # [skip ci], so NO run follows it. Skipping for that mover strands this
      # build until the next cron - article 266 sat saved-but-unpublished
      # exactly this way. Our dist/ was built from data this run fetched
      # itself, so the other run's data commit changes nothing we would ship.
      # Deploy when the ONLY thing that moved main is data commit-backs.
      - name: Skip the deploy if main moved past this checkout
        id: tip
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            CONTENT=$(git log --format=%s HEAD..origin/main                       | grep -cv '^data refresh \[skip ci\]$' || true)
            if [ "$CONTENT" -eq 0 ]; then
              echo "fresh=true" >> "$GITHUB_OUTPUT"
              echo "main moved by data commit-back only - deploying (no newer run is coming)"
            else
              echo "fresh=false" >> "$GITHUB_OUTPUT"
              echo "main moved $(git rev-parse --short HEAD) -> $(git rev-parse --short origin/main) with $CONTENT content commit(s); skipping deploy"
            fi
          fi

      - name: Deploy to Cloudflare
        if: steps.tip.outputs.fresh == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy

      # New-article Facebook post. Lives HERE (after Deploy) and not in
      # daily-article.yml on purpose: posting the moment the article was
      # committed let Facebook scrape the link before the page existed, and
      # the post kept a "الصفحة غير موجودة" preview forever (article 358,
      # 2026-09-03). fb_post.py --auto posts the top article once (state in
      # data/fb_posted.json), only if it is <12h old, after asking Facebook to
      # scrape the now-live URL. Gated on `fresh` so the page IS deployed.
      - name: Post new article to Facebook
        if: steps.tip.outputs.fresh == 'true'
        continue-on-error: true
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python fb_post.py --auto

      # Facebook result cards: one native image post per FINISHED curated-club
      # match (fb_cards.py renders it from data/matches.json + goal_events.json
      # fetched above). Runs every refresh, so a card lands within ~15 min of
      # the final whistle. Dedup/state lives in data/fb_posted.json and rides
      # the commit-back below. Inert until the FB_PAGE_TOKEN secret exists
      # (same token as fb_post.py); never fails the publish over a social error.
      - name: Post result cards to Facebook
        # gated like the article post: a card links to /m/<id> and must not go
        # out from a run that skipped its deploy (the page would still say LIVE)
        if: steps.tip.outputs.fresh == 'true'
        continue-on-error: true
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python fb_cards.py --post --hours 6

      # Match-analysis articles (previews before kick-off, reports after
      # full-time) for the curated clubs: when match_brief.py finds a
      # candidate in the data this run just fetched, dispatch the AI writer.
      # Skipped while a match-article run is already queued/in progress (its
      # concurrency group would only queue a duplicate that exits "no
      # candidate" anyway). Never fails the publish.
      - name: Dispatch match-article when a match needs one
        if: steps.tip.outputs.fresh == 'true'
        continue-on-error: true
        run: |
          PICK=$(python match_brief.py --pick 2>/dev/null || echo '{}')
          echo "pick: $PICK"
          if [ "$PICK" = "{}" ] || [ -z "$PICK" ]; then exit 0; fi
          BUSY=$(curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/match-article.yml/runs?per_page=5" \
            | python -c "import json,sys; rs=json.load(sys.stdin).get('workflow_runs',[]); print(sum(1 for r in rs if r['status'] in ('queued','in_progress','waiting')))")
          if [ "$BUSY" != "0" ]; then echo "match-article already running ($BUSY) - not dispatching"; exit 0; fi
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/match-article.yml/dispatches" \
            -d '{"ref":"main"}' && echo "dispatched match-article for $PICK"

      # Keep the repo copy of data/ fresh (caps the failed-fetch fallback at
      # ~30 min of staleness). This step runs AFTER build+deploy on purpose:
      # on 2026-08-08 two parallel runs raced here, the rebase left conflict
      # markers inside data/headlines.json, and the build that followed parsed
      # broken JSON -> the live home page lost its headlines section. Down
      # here, a git race can only affect this commit - never the deployed site.
      - name: Commit refreshed data back to the repo
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data refresh [skip ci]"
            git pull --rebase origin main || git rebase --abort || true
            git push || echo "push failed (race with another commit) - data refresh skipped"
          fi
