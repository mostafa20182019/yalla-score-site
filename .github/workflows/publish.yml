name: Publish Yalla Score

# Runs on GitHub's servers (free, no PC needed). Fetches latest news + matches,
# rebuilds the static site, and deploys it to Cloudflare.
on:
  push:
    branches: [ main ]           # deploy on every push (also forces GitHub to register the workflow)
  schedule:
    - cron: "7,22,37,52 * * * *"  # 4x/hour on off-peak minutes (GitHub cron is best-effort and often delayed/skipped; extra slots = fresher data)
  workflow_dispatch: {}          # allows a manual run from the Actions tab (also fired by the Cloudflare Worker cron)

permissions:
  contents: write                # needed to commit refreshed data/ back to the repo

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch latest content (news + matches)
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
        run: python fetch_data.py

      # Keep the repo copy of data/ fresh. fetch_data.py keeps the old file
      # when a source fails, so without this step a failed fetch would fall
      # back to whatever was last committed (once 13 days stale -> July
      # headlines went live). Committing after every successful fetch caps
      # the worst-case fallback at ~30 minutes. [skip ci] stops the push
      # from re-triggering this workflow.
      - name: Commit refreshed data back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data refresh [skip ci]"
            git pull --rebase origin main || true
            git push || echo "push failed (race with another commit) - deploy continues"
          fi

      - name: Build the static site
        run: python build_site.py

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # default pinned wrangler is too old for [assets].run_worker_first,
          # which the canonical-host 301 redirect in worker.js depends on
          wranglerVersion: "latest"
