name: Season carry-over (Elo seeds)

# Roadmap factor 1 (2026-09-12): pull LAST season's results for the five big
# European leagues from football-data.org and write data/elo_seeds.json - the
# starting Elo of every club this season (two thirds of last season's edge,
# promoted clubs at the mean of the relegated). The FD_TOKEN lives only here,
# so the fetch runs on the runner; the seeds themselves are then committed and
# read by the build (analysis.team_stats) and by the Oracle copy (ELO_SEEDS).
#
# Runs when this file or season_carry.py changes (so the first push does the
# first fetch), or by hand from the Actions tab. Once a season is enough; the
# build itself never calls football-data for this.
on:
  push:
    branches: [main]
    paths:
      - season_carry.py
      - .github/workflows/season-carry.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: season-carry
  cancel-in-progress: false

jobs:
  seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch last season and compute the seeds
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
        run: |
          # pipefail: a failed fetch must FAIL this step (the first run hid a
          # fetch error behind tee's exit code and died in the commit step
          # with exit 128 - "pathspec did not match", nothing to add)
          set -o pipefail
          rc=0
          # the log is COMMITTED next to the raw files (data/season_prev/_last_run.txt)
          # so the outcome can be read from the repo itself - the job summary is
          # not readable without a GitHub login
          mkdir -p data/season_prev
          { date -u; python season_carry.py --fetch --seeds --show 2>&1; echo "exit $?"; } | tee data/season_prev/_last_run.txt
          grep -q '^exit 0$' data/season_prev/_last_run.txt || rc=1
          {
            echo "### Elo seeds (exit $rc)"
            echo '```'
            head -n 80 data/season_prev/_last_run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # [skip ci]: the next 15-minute refresh picks the seeds up; no extra deploy
      - name: Commit the raw season, the seeds and the run log
        if: always()
        run: |
          git config user.name "yalla-score-bot"
          git config user.email "bot@yallascore.site"
          git add data/season_prev
          [ -f data/elo_seeds.json ] && git add data/elo_seeds.json
          if git diff --cached --quiet; then
            echo "seeds unchanged - nothing to commit"; exit 0
          fi
          git commit -m "elo seeds: season carry-over for the five European leagues [skip ci]"
          git pull --rebase origin main
          git push origin main
