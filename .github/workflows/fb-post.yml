name: Facebook Post (articles)

# Posts new articles to the Facebook page.
#
# It is a workflow of its own for ONE reason now: publish.yml's refresh runs are
# cancellable, and a run killed between "posted to Facebook" and "recorded the
# post" would leave an open claim that the TTL later hands to another run - a
# duplicate 15 minutes late. This job has cancel-in-progress: false, so it runs
# to completion and that window only opens on a hard crash.
#
# It no longer exists to SERIALISE posting. It used to: two overlapping publish
# runs posted article 422 twice on 2026-09-07 because both read a json state
# file neither had written yet, and a concurrency queue was the workaround.
# The claim is now an INSERT on PRIMARY KEY (kind, ref_id) in D1
# (store.py / fb_post.auto), so the loser of a race cannot post at all - with
# or without a queue. The queue stays only as the no-cancel guarantee above.
#
# publish.yml dispatches this after its deploy, and only when
# `python fb_post.py --pending` says there is something to post.
on:
  workflow_dispatch: {}

permissions:
  contents: read           # the state lives in D1; nothing is pushed

concurrency:
  group: fb-post
  cancel-in-progress: false     # QUEUE, never run two at once - the whole point

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Post new articles to Facebook
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          # the dedup state: with these the claim is an atomic INSERT in D1,
          # without them store.py falls back to the old json file
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
        run: |
          python fb_post.py --auto | tee /tmp/fb.txt
          {
            echo "### Facebook"
            echo '```'
            tail -n 25 /tmp/fb.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
