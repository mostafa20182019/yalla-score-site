name: Facebook Post (articles)

# Posts new articles to the Facebook page.
#
# It is a workflow of its own for ONE reason now: publish.yml's refresh runs are
# cancellable, and a run killed between "posted to Facebook" and "recorded the
# post" would leave an open claim that the TTL later hands to another run - a
# duplicate 15 minutes late. This job has cancel-in-progress: false, so it runs
# to completion and that window only opens on a hard crash.
#
# It no longer exists to SERIALISE posting. It used to: two overlapping publish
# runs posted article 422 twice on 2026-09-07 because both read a json state
# file neither had written yet, and a concurrency queue was the workaround.
# The claim is now an INSERT on PRIMARY KEY (kind, ref_id) in D1
# (store.py / fb_post.auto), so the loser of a race cannot post at all - with
# or without a queue. The queue stays only as the no-cancel guarantee above.
#
# publish.yml dispatches this after its deploy, and only when
# `python fb_post.py --pending` says there is something to post.
on:
  workflow_dispatch:
    inputs:
      repost:
        description: "Repost ONE article by id (only after deleting its old post on the page). Empty = normal run."
        required: false
        default: ""
      update:
        description: "Rewrite the TEXT of already-posted articles in place from the export (ids, comma-separated). Run D1 Admin fix-text first."
        required: false
        default: ""
      xi:
        description: "Post the line-up CARD of a 365scores game id (dispatched by the Worker when both XIs are announced)."
        required: false
        default: ""
      text:
        description: "Post drafts/fb/<name>.txt as a plain text post (give the name without .txt; the file must be on main). Posted once per name."
        required: false
        default: ""
      daycard:
        description: "Post the day's RESULTS card (`results`, dispatched nightly by the Worker), the same results as a REEL (day_reel.py) and then the news-from-the-data posts (story_events.py); `events` = those posts only; `today` = the MORNING card, today's fixtures and channels."
        required: false
        default: ""
      goal:
        description: "Post one goal as a CARD: the JSON the Worker dispatched ({g, seq, ev})."
        required: false
        default: ""
      whistle:
        description: "Post kick-off / half-time / full-time as a CARD: the JSON the Worker dispatched ({kind: ko|ht|ft, g, goals})."
        required: false
        default: ""
      h2h:
        description: "Head-to-head infographic for ONE upcoming match (match_id), or `auto` for the biggest match of the next days. Empty = normal run."
        required: false
        default: ""
      prediction:
        description: "Prediction post for ONE upcoming match (match_id from /m/<id>): our card + the model's numbers + a question. Empty = normal run."
        required: false
        default: ""
      moment:
        description: "Publish a MOMENT reel (moments/<id>.json, e.g. salah-congo-2017): a historic moment as a 16 s typography reel. Or `file:<name>` = post drafts/reels/<name>.mp4 as it is, caption drafts/reels/<name>.txt, once per name."
        required: false
        default: ""

permissions:
  contents: read           # the state lives in D1; nothing is pushed

concurrency:
  group: fb-post
  cancel-in-progress: false     # QUEUE, never run two at once - the whole point

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      # data/ (matches, fixtures, standings...) lives in Workers KV, not git:
      # the prediction and H2H posts read matches.json, so pull first
      # (2026-10-11: «match 4804684 is not in matches.json» on the derby day)
      # 2026-11-20: ONE failed pull at 22:16 UTC cost the whole night - no
      # results card, no reel (run 44627104040 stopped here). A failed pull
      # must still stop the job (stale data is never posted), but only after
      # three tries a few seconds apart.
      - name: Pull the working data
        run: |
          for i in 1 2 3; do
            python data_store.py pull && exit 0
            echo "data pull failed (try $i of 3)"
            [ "$i" = 3 ] || sleep 20
          done
          exit 1

      # 2026-10-09: a token of ANOTHER page posted a whole day of articles to it
      # while every run stayed green. Refuse to post with anything but the Yalla
      # Score page's own token.
      - name: Check whose token this is
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          python fb_post.py --whoami | tee /tmp/who.txt; rc=${PIPESTATUS[0]}
          { echo "### Token"; echo '```'; cat /tmp/who.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Post new articles to Facebook
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          # web push to a club's followers (push_team.py, 2026-11-19)
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # the goal and full-time cards go to the Telegram channel too (2026-11-12)
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # the dedup state: with these the claim is an atomic INSERT in D1,
          # without them store.py falls back to the old json file
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
          REPOST: ${{ inputs.repost }}
          UPDATE: ${{ inputs.update }}
          XI: ${{ inputs.xi }}
          TEXT: ${{ inputs.text }}
          DAYCARD: ${{ inputs.daycard }}
          GOAL: ${{ inputs.goal }}
          WHISTLE: ${{ inputs.whistle }}
          PREDICTION: ${{ inputs.prediction }}
          H2H: ${{ inputs.h2h }}
          MOMENT: ${{ inputs.moment }}
          # prediction posts are off until this repo variable is "on" (2026-10-18)
          FB_PREDICTIONS: ${{ vars.FB_PREDICTIONS }}
          # the news-from-the-data posts (story_events.py) are printed, not
          # posted, until this one is "on" (2026-11-08: he reads the wording first)
          FB_EVENTS: ${{ vars.FB_EVENTS }}
          # the club-form / club-streak cards + reels (2026-11-09) print until this one is "on" as well
          FB_FORM: ${{ vars.FB_FORM }}
          # the social review's kinds (story_social.py, 2026-11-19) print until this one is "on"
          FB_SOCIAL: ${{ vars.FB_SOCIAL }}
          # the match-day poster (match_poster.py) and the title-race reel
          # (race_reel.py), 2026-11-20: each prints until its own variable is "on"
          FB_POSTER: ${{ vars.FB_POSTER }}
          FB_RACE: ${{ vars.FB_RACE }}
        run: |
          if [ "${MOMENT#file:}" != "$MOMENT" ]; then
            # a finished reel file (user 2026-11-11): uploaded as it is, no ffmpeg.
            # Rides the `moment` input - GitHub allows 10 inputs and all 10 are taken
            python fb_reel.py --post-file "${MOMENT#file:}" | tee /tmp/fb.txt; rc=${PIPESTATUS[0]}
          elif [ -n "$MOMENT" ]; then
            command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
            python moment_reel.py --script "moments/$MOMENT.json" --publish | tee /tmp/fb.txt; rc=${PIPESTATUS[0]}
          elif [ -n "$WHISTLE" ]; then
            python fb_post.py --whistle "$WHISTLE" | tee /tmp/fb.txt; rc=${PIPESTATUS[0]}
            # «تابع فريقك» (2026-11-19): the same kick-off / full-time to the
            # browsers that follow one of the two clubs - only once the card
            # above is posted, and never a reason for this job to fail
            python push_team.py --whistle "$WHISTLE" | tee -a /tmp/fb.txt || true
          elif [ -n "$GOAL" ]; then
            python fb_post.py --goal "$GOAL" | tee /tmp/fb.txt; rc=${PIPESTATUS[0]}
            python push_team.py --goal "$GOAL" | tee -a /tmp/fb.txt || true
          elif [ -n "$XI" ]; then
            python fb_post.py --xi "$XI" | tee /tmp/fb.txt; rc=${PIPESTATUS[0]}
          elif [ -n "$TEXT" ]; then
            python fb_post.py --text "drafts/fb/$TEXT.txt" | tee /tmp/fb.txt; rc=${PIPESTATUS[0]}
          elif [ "$DAYCARD" = "events" ]; then
            # a club-form event also makes a reel (form_reel.py, behind FB_REELS)
            command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
            python fb_post.py --events | tee /tmp/fb.txt; rc=${PIPESTATUS[0]}
          elif [ "$DAYCARD" = "today" ]; then
            # the MORNING card (2026-11-19): today's fixtures with their
            # kick-off times and channels - the Worker dispatches it at 07:01
            # UTC; nothing else rides on this run
            python fb_post.py --daycard today | tee /tmp/fb.txt; rc=${PIPESTATUS[0]}
            # the same fixtures as a REEL (user 2026-11-20: «ماشي آه نعمل ريل
            # كده»): the day's match first, then six a shot - once a day
            # (store kind reel / today:<date>)
            command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
            python day_reel.py --today --publish | tee -a /tmp/fb.txt; rc3=${PIPESTATUS[0]}
            [ "$rc" = 0 ] && rc=$rc3
            # a pair of site_lib/h2h.PAIRS meets today: its head-to-head reel
            # (h2h_reel.py, rewritten 2026-11-20) - nothing on any other day
            python h2h_reel.py --auto --publish | tee -a /tmp/fb.txt; rc5=${PIPESTATUS[0]}
            [ "$rc" = 0 ] && rc=$rc5
            # the day's match in the two clubs' own colours, when one of ours
            # plays (behind FB_POSTER); it never fails the job
            python match_poster.py --auto --publish | tee -a /tmp/fb.txt || true
          elif [ -n "$DAYCARD" ]; then
            # the nightly hook: the results card, then whatever the data says
            # is news tonight (story_events.py) - each once, through the store
            python fb_post.py --daycard "$DAYCARD" | tee /tmp/fb.txt; rc=${PIPESTATUS[0]}
            # the same results as a reel (day_reel.py, user 2026-11-09), once a day
            command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
            python day_reel.py --publish | tee -a /tmp/fb.txt; rc3=${PIPESTATUS[0]}
            # the scorers race (scorers_reel.py, user 2026-11-10 «أتمتها»): the
            # Premier League / Egyptian league / La Liga reel once a round ends,
            # one league a night, each round once (store kind reel / scorers:...)
            python scorers_reel.py --auto | tee -a /tmp/fb.txt; rc4=${PIPESTATUS[0]}
            # «الصاعد والهابط» (movers_reel.py, 2026-11-20): the table's movers
            # the night after a league round ends - one league a night, each
            # round once; it never fails the job
            python movers_reel.py --auto | tee -a /tmp/fb.txt || true
            # the title race as lines, once every three rounds of a league
            # (behind FB_RACE); it never fails the job
            python race_reel.py --auto | tee -a /tmp/fb.txt || true
            python fb_post.py --events | tee -a /tmp/fb.txt; rc2=${PIPESTATUS[0]}
            [ "$rc" = 0 ] && rc=$rc3
            [ "$rc" = 0 ] && rc=$rc4
            [ "$rc" = 0 ] && rc=$rc2
          elif [ -n "$UPDATE" ]; then
            python fb_update_posts.py ${UPDATE//,/ } | tee /tmp/fb.txt; rc=${PIPESTATUS[0]}
          elif [ -n "$H2H" ]; then
            python fb_post.py --h2h "$H2H" | tee /tmp/fb.txt; rc=${PIPESTATUS[0]}
          elif [ -n "$PREDICTION" ]; then
            python fb_post.py --prediction "$PREDICTION" | tee /tmp/fb.txt; rc=${PIPESTATUS[0]}
          elif [ -n "$REPOST" ]; then
            rc=0; for id in ${REPOST//,/ }; do python fb_post.py --repost "$id" | tee -a /tmp/fb.txt || rc=1; done
          else
            python fb_post.py --auto | tee /tmp/fb.txt; rc=${PIPESTATUS[0]}
          fi
          {
            echo "### Facebook"
            echo '```'
            tail -n 25 /tmp/fb.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
