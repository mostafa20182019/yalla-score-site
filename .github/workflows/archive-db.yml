name: Archive to the database (daily)

# The permanent archive (user, 2026-11-03: «عايز الداتا اللى عندى على الموقع
# ... تتحفظ عندى فى الداتا بيز عشان الموسم اللى جاى»): archive_db.py writes
# the finished matches, their scorers and details, today's league tables and
# top players, and the highlight links into the arch_* tables of D1
# (d1_archive.sql). Nothing is ever pruned there; every row carries its season.
#
# Once a day is enough: the daily run re-sends the last 10 days of matches, so
# a run GitHub's best-effort schedule skips loses nothing but that day's table
# snapshot. Run it by hand with seed=true to (re)write everything the data
# store holds - the first run, or after a schema change.
on:
  schedule:
    - cron: "40 22 * * *"         # 22:40 UTC = 00:40 Cairo, after the evening matches, before D1's 00:00 UTC reset
  workflow_dispatch:
    inputs:
      seed:
        description: "write everything the data store holds (first run)"
        type: boolean
        default: false
      details:
        description: "matches to fetch missing scorers / lineups for from 365scores (2026-11-03 backfill)"
        type: number
        default: 400

permissions:
  contents: read

concurrency:
  group: archive-db
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40            # the details backfill: ~1.2 s a game, 400 a night
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Pull the working data
        run: python data_store.py pull

      - name: Write the archive
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
        run: |
          python archive_db.py ${{ inputs.seed && '--seed' || '' }} --details ${{ inputs.details || 400 }} | tee -a "$GITHUB_STEP_SUMMARY"
          python archive_db.py --check | tee -a "$GITHUB_STEP_SUMMARY"

      # The season's details back to the build (SEO pass, 2026-11-04): the
      # data store keeps match_details for 45 days, so an older result had no
      # lineups and no reading and its /m/ page stayed NOINDEX. The export is
      # the arch_details table as match_details items; the build merges it
      # under the store (site_lib.matchdata.merge_details). Pushed --only, so
      # the fetch files this job pulled at its start are left to the publish
      # runs that refreshed them since.
      # Two tokens: CF_API_TOKEN reads D1 (the export), CLOUDFLARE_API_TOKEN
      # writes Workers KV (the push - publish.yml's store steps use the same
      # one; the D1 token got HTTP 401 on the first run, 2026-11-04).
      # pipefail: without it `| tee` hid that 401 behind a green step.
      - name: Export the season's details for the build
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
        run: |
          set -o pipefail
          python archive_db.py --export data/details_archive.json | tee -a "$GITHUB_STEP_SUMMARY"
          python data_store.py push --only details_archive.json | tee -a "$GITHUB_STEP_SUMMARY"
