name: Archive to the database (daily)

# The permanent archive (user, 2026-11-03: «عايز الداتا اللى عندى على الموقع
# ... تتحفظ عندى فى الداتا بيز عشان الموسم اللى جاى»): archive_db.py writes
# the finished matches, their scorers and details, today's league tables and
# top players, and the highlight links into the arch_* tables of D1
# (d1_archive.sql). Nothing is ever pruned there; every row carries its season.
#
# Once a day is enough: the daily run re-sends the last 10 days of matches, so
# a run GitHub's best-effort schedule skips loses nothing but that day's table
# snapshot. Run it by hand with seed=true to (re)write everything the data
# store holds - the first run, or after a schema change.
on:
  schedule:
    - cron: "40 22 * * *"         # 22:40 UTC = 00:40 Cairo, after the evening matches, before D1's 00:00 UTC reset
  workflow_dispatch:
    inputs:
      seed:
        description: "write everything the data store holds (first run)"
        type: boolean
        default: false
      details:
        description: "matches to fetch missing scorers / lineups for from 365scores (2026-11-03 backfill)"
        type: number
        default: 400

permissions:
  contents: read

concurrency:
  group: archive-db
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40            # the details backfill: ~1.2 s a game, 400 a night
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Pull the working data
        run: python data_store.py pull

      - name: Write the archive
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
        run: |
          python archive_db.py ${{ inputs.seed && '--seed' || '' }} --details ${{ inputs.details || 400 }} | tee -a "$GITHUB_STEP_SUMMARY"
          python archive_db.py --check | tee -a "$GITHUB_STEP_SUMMARY"
