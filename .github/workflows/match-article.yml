name: Match Article (AI)

# Writes ONE Arabic match-analysis article (preview before kick-off, report
# after full-time) for a curated-club match, from a numbers-only brief built
# by match_brief.py, using Claude Code headless. Prompt:
# .github/prompts/match-article.md
#
# Triggers: the Cloudflare Worker cron dispatches this workflow at four fixed
# Cairo times - 13:00, 17:00, 20:00, 23:30 (wrangler.toml crons 3+4,
# worker.js matchSlotCairo) - one article per slot, reports before previews,
# Egyptian clubs first. The pick step re-checks at run time, so a slot with
# nothing to write just exits with "no candidate".
#
# No GitHub schedule (its hourly cron fired twice in fourteen days - GitHub
# throttles schedule triggers on free repos) and, since 2026-09-12, no
# dispatch from publish.yml either (every 15 minutes it had produced six
# previews in seventy minutes). The Worker cron is exact.
on:
  workflow_dispatch:
    inputs:
      match_id:
        description: "match_id from data/matches.json (empty = auto-pick)"
        type: string
        default: ""
      kind:
        description: "preview | report (empty = auto)"
        type: choice
        default: ""
        options: ["", "preview", "report"]

permissions:
  contents: write
  actions: write

# never two match-article runs at once (duplicate-article risk); never cancel
# a run that may be mid-publish. Separate group from daily-article so a news
# article and a match article can be written in parallel.
concurrency:
  group: match-article
  cancel-in-progress: false

jobs:
  write-match-article:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      # Which match/kind? Explicit inputs win; otherwise match_brief.py picks
      # the best candidate (reports first, Egyptian clubs first, daily cap).
      - name: Pick the match
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.match_id }}" ]; then
            MID="${{ github.event.inputs.match_id }}"; KIND="${{ github.event.inputs.kind }}"
          else
            J=$(python match_brief.py --pick)
            MID=$(python -c "import json,sys; print(json.loads(sys.argv[1]).get('match_id',''))" "$J")
            KIND=$(python -c "import json,sys; print(json.loads(sys.argv[1]).get('kind',''))" "$J")
          fi
          echo "match_id=$MID" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          if [ -z "$MID" ]; then
            echo "## ⏭ no candidate match right now" >> "$GITHUB_STEP_SUMMARY"
            echo "no candidate"; exit 0
          fi
          echo "## 🎯 $KIND for match $MID" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the brief
        if: steps.pick.outputs.match_id != ''
        run: |
          mkdir -p /tmp/brief
          python match_brief.py --brief "${{ steps.pick.outputs.match_id }}" \
            ${{ steps.pick.outputs.kind != '' && format('--kind {0}', steps.pick.outputs.kind) || '' }} \
            --out /tmp/brief/brief.json | tee /tmp/brief/brief.md
          {
            echo "### Brief"; echo '```'; head -n 60 /tmp/brief/brief.md; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.match_id != ''
        with:
          node-version: "20"

      - name: Install Claude Code
        if: steps.pick.outputs.match_id != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Remember state
        if: steps.pick.outputs.match_id != ''
        run: echo "HEAD_BEFORE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # ONE Claude account since 2026-09-12 (second-account failover removed on
      # the user's decision). continue-on-error keeps the run green when the
      # account is out of quota: the next slot simply retries.
      - name: Write the article
        id: write
        if: steps.pick.outputs.match_id != ''
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
          MATCH_ID: ${{ steps.pick.outputs.match_id }}
          KIND: ${{ steps.pick.outputs.kind }}
          BRIEF_JSON: /tmp/brief/brief.json
          BRIEF_MD: /tmp/brief/brief.md
        run: |
          set -o pipefail
          claude -p "$(cat .github/prompts/match-article.md)" \
            --model claude-sonnet-5 \
            --dangerously-skip-permissions | tee /tmp/claude.txt
          { echo "### تقرير Claude"; echo '```'; tail -n 40 /tmp/claude.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Report outcome
        if: always() && steps.pick.outputs.match_id != ''
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_BEFORE" ]; then
            TITLE=$(python -c "import json; print(json.load(open('data/articles.json',encoding='utf-8'))['results'][0]['items'][0]['title'])")
            echo "## ✅ مقال جديد: $TITLE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ⏭ لا مقال هذا التشغيل - السبب في تقرير Claude أعلاه" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Flag a failed Claude step
        if: steps.write.outcome == 'failure'
        run: |
          echo "::warning::The Claude step failed (exit code non-zero) - check the account's quota / token if this repeats."
          echo "### ⚠️ Claude step failed this run" >> "$GITHUB_STEP_SUMMARY"

      # publish.yml deploys main; a GITHUB_TOKEN push doesn't fire on:push, so
      # dispatch it (the article's Facebook post happens there, after Deploy).
      # ONLY when an article was actually committed (2026-09-12). Dispatching
      # on every run was one half of a loop: publish.yml dispatched this
      # workflow whenever a candidate existed, this dispatched publish.yml even
      # when Claude wrote nothing, and the two ping-ponged every ~2 minutes for
      # three hours on 2026-09-11 (23 bot dispatches an hour). The other half
      # is gone too (publish.yml no longer dispatches match-article), but a
      # run that produced nothing has nothing to publish either way.
      - name: Dispatch publish workflow
        if: always() && steps.pick.outputs.match_id != ''
        run: |
          if [ "$(git rev-parse HEAD)" = "$HEAD_BEFORE" ]; then
            echo "no article was committed this run - not dispatching publish"
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish.yml/dispatches" \
            -d '{"ref":"main","inputs":{"reason":"article"}}'
