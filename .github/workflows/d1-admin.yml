name: D1 Admin

# Maintenance for the D1 state store, on a cron and on demand from the Actions
# tab.
#
# It lives here rather than as a local script because the three Cloudflare
# secrets exist only in GitHub - the migration deliberately never puts a
# Cloudflare token on a laptop.
#
# Tasks:
#   status   which backend is live + a row count per table (read-only)
#   init     create the tables (idempotent)
#   migrate  init + load the existing data/*.json into D1 + verify the counts
#   export   dump D1 back to data/*.json and commit it (the audit log)
#   verify   compare D1's row counts against the json files (read-only)
#   warehouse reload the analytics facts so they can be queried in SQL
#   sample   run the analytics queries and print them (read-only)
#   fix-images apply data/image_fixes.json - correct the photo of an article that
#            is already published (see that file for why each one was wrong)
on:
  # Daily export, 04:20 Cairo - a quiet hour, and clear of the 06:30 article
  # upgrade job. Daily is deliberate: the export is a BACKUP and the build's
  # fallback source, not a live mirror, and committing it every 15 minutes
  # would add ~96 state commits a day for nothing. Raise the cadence here if
  # the fallback ever needs to be fresher than a day.
  #
  # The hourly WAREHOUSE cron that used to sit here fired ~16 times in fourteen
  # days instead of ~336 - GitHub throttles schedule triggers - so the refresh
  # moved into publish.yml (2026-09-12), whose runs the Cloudflare Worker cron
  # actually starts. `warehouse` stays available here as a manual task.
  schedule:
    - cron: "20 2 * * *"      # export  (daily backup, see above)
  workflow_dispatch:
    inputs:
      task:
        description: "What to do"
        type: choice
        default: "status"
        options: [ "status", "init", "migrate", "export", "verify", "warehouse",
                   "sample", "articles-backfill", "fix-images" ]

permissions:
  contents: write          # the export task commits data/*.json

concurrency:
  group: d1-admin
  cancel-in-progress: false

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # the first full warehouse load is ~12k rows
    env:
      # `inputs.task` is empty on a schedule trigger, and the only schedule
      # left is the daily export
      TASK: ${{ inputs.task || 'export' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the task
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
        run: |
          set -o pipefail
          python d1_admin.py --"$TASK" | tee /tmp/d1.txt
          {
            echo "### D1 · $TASK"
            echo '```'
            cat /tmp/d1.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only the export task changes files. Committing it keeps the ability to
      # walk the state's history in git, which is how the duplicate-post bug
      # was found in the first place.
      - name: Commit the export
        if: env.TASK == 'export'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/; then
            git add data/fb_posted.json data/predictions.json data/articles.json
            git commit -m "d1: export state [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            echo "::warning::could not push the D1 export"
          else
            echo "export matches what is already committed"
          fi
