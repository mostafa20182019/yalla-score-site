name: Daily Article (AI)

# Runs Claude Code headless on GitHub's servers to write ONE original Arabic
# article (prompt: .github/prompts/daily-article.md) and push it to main.
# Replaces the local scheduled task so articles publish even when the PC is off.
on:
  schedule:
    # 10 runs/day (user request 2026-08-23, was 3): Cairo 09,11,13,15,17,18,
    # 20,21,22,23 (UTC+3) — denser in the evening when football news peaks.
    # A run still publishes nothing when no fresh 2-source story exists, so
    # 10 slots = up to 10 articles, not exactly 10.
    - cron: "0 6,8,10,12,14,15,17,18,19,20 * * *"
  workflow_dispatch: {}          # manual test runs from the Actions tab

permissions:
  contents: write                # Claude commits the article + image
  actions: write                 # dispatch publish.yml afterwards (GITHUB_TOKEN pushes don't trigger on:push)

# Never two article runs at once (duplicate-article risk); never cancel a
# run that may be mid-publish.
concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  write-article:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install googlenewsdecoder pillow

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # fb_post.py posts only when the top article id CHANGES during this
      # run, so remember it before Claude writes anything.
      - name: Remember newest article id
        run: |
          PREV_ID=$(python -c "import json; items=json.load(open('data/articles.json',encoding='utf-8'))['results'][0]['items']; print(items[0]['article_id'] if items else '')")
          echo "PREV_ARTICLE_ID=$PREV_ID" >> "$GITHUB_ENV"

      - name: Write today's article
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat .github/prompts/daily-article.md)" \
            --model claude-sonnet-5 \
            --dangerously-skip-permissions

      # Auto-post the new article to the Facebook page («يلا سكور - Yalla Score»).
      # Inert until the FB_PAGE_TOKEN repo secret exists (fb_post.py skips
      # silently without it) and never fails the run over a social error.
      - name: Post new article to Facebook
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python fb_post.py "$PREV_ARTICLE_ID"

      # publish.yml deploys the tip of main. A push made with GITHUB_TOKEN does
      # NOT fire its on:push trigger, so dispatch it explicitly; without this
      # the article would wait for the next 15-min refresh slot.
      - name: Dispatch publish workflow
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish.yml/dispatches" \
            -d '{"ref":"main"}'
