name: Daily Article (AI)

# Runs Claude Code headless on GitHub's servers to write ONE original Arabic
# article (prompt: .github/prompts/daily-article.md) and push it to main.
# Replaces the local scheduled task so articles publish even when the PC is off.
on:
  schedule:
    # 10 runs/day (restored 2026-09-01; was cut to 5 on 2026-08-26): Cairo
    # 9,11,13,15,17,18,20,21,22,23 (UTC+3). The PRIMARY trigger is the
    # Cloudflare Worker cron ("0 6,8,10,12,14,15,17,18,19,20" in
    # wrangler.toml) — exact and reliable, added after GitHub silently
    # SKIPPED the 17:00 UTC slot on 2026-08-26. This schedule is only the
    # 30-min-late FALLBACK: when the CF run already published, this run
    # finds no fresh story and skips (dedup guards it). A run still
    # publishes nothing when no fresh 2-source story exists.
    - cron: "30 6,8,10,12,14,15,17,18,19,20 * * *"
  workflow_dispatch:              # manual test runs from the Actions tab
    inputs:
      account:
        description: "Claude account to try FIRST (repo default = the PRIMARY_ACCOUNT variable)"
        type: choice
        default: "repo default"
        options:
          - "repo default"
          - "1"
          - "2"

permissions:
  contents: write                # Claude commits the article + image
  actions: write                 # dispatch publish.yml afterwards (GITHUB_TOKEN pushes don't trigger on:push)

# Never two article runs at once (duplicate-article risk); never cancel a
# run that may be mid-publish.
concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  write-article:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # secrets can't be read inside a step-level if:, so surface it as a flag here
    env:
      HAS_ACCT2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 != '' }}
      # Which account goes FIRST: the Run-workflow dropdown wins, else the
      # PRIMARY_ACCOUNT repo variable, else account 1. The other one stays the
      # fallback, so a wrong value can never leave the run without an account.
      PRIMARY_ACCT: ${{ (github.event.inputs.account == '1' || github.event.inputs.account == '2') && github.event.inputs.account || vars.PRIMARY_ACCOUNT || '1' }}
    steps:
      - name: Show account choice
        run: |
          echo "Primary Claude account: $PRIMARY_ACCT (the other one is the fallback)"
          echo "Primary Claude account: **$PRIMARY_ACCT**" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install googlenewsdecoder pillow

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # fb_post.py posts only when the top article id CHANGES during this
      # run, so remember it before Claude writes anything.
      - name: Remember newest article id
        run: |
          PREV_ID=$(python -c "import json; items=json.load(open('data/articles.json',encoding='utf-8'))['results'][0]['items']; print(items[0]['article_id'] if items else '')")
          echo "PREV_ARTICLE_ID=$PREV_ID" >> "$GITHUB_ENV"
          echo "HEAD_BEFORE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Write today's article (primary account)
        id: acct1
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.PRIMARY_ACCT == '2' && secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat .github/prompts/daily-article.md)" \
            --model claude-sonnet-5 \
            --dangerously-skip-permissions

      # Account 1 can die at three points: before writing, mid-write (image
      # downloaded, article not saved), or AFTER committing. Only the middle
      # case may be retried - retrying a committed article duplicates it.
      - name: Decide whether to retry
        id: retry
        if: steps.acct1.outcome == 'failure'
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_BEFORE" ]; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "Account 1 already committed an article - no fallback."
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
            git reset --hard HEAD
            git clean -fd
          fi

      - name: Write today's article (fallback account)
        id: acct2
        if: steps.acct1.outcome == 'failure' && steps.retry.outputs.committed == 'false' && env.HAS_ACCT2 == 'true'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.PRIMARY_ACCT == '2' && secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
        run: |
          claude -p "$(cat .github/prompts/daily-article.md)" \
            --model claude-sonnet-5 \
            --dangerously-skip-permissions

      # Both accounts out = no article this slot, but NOT a broken pipeline:
      # the next slot retries. Stay green so the run list stays meaningful,
      # but leave a loud marker so a REAL outage (expired token) is visible.
      - name: Flag exhausted accounts
        if: steps.acct1.outcome == 'failure' && steps.acct2.outcome != 'success' && steps.retry.outputs.committed != 'true'
        run: |
          echo "::warning::No article written - the primary Claude account failed and the fallback did not succeed."
          echo "### No article this run" >> "$GITHUB_STEP_SUMMARY"
          echo "primary=$PRIMARY_ACCT | ${{ steps.acct1.outcome }} / fallback ${{ steps.acct2.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      # Auto-post the new article to the Facebook page («يلا سكور - Yalla Score»).
      # Inert until the FB_PAGE_TOKEN repo secret exists (fb_post.py skips
      # silently without it) and never fails the run over a social error.
      - name: Post new article to Facebook
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python fb_post.py "$PREV_ARTICLE_ID"

      # publish.yml deploys the tip of main. A push made with GITHUB_TOKEN does
      # NOT fire its on:push trigger, so dispatch it explicitly; without this
      # the article would wait for the next 15-min refresh slot.
      - name: Dispatch publish workflow
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish.yml/dispatches" \
            -d '{"ref":"main"}'
