name: Daily Article (AI)

# Runs Claude Code headless on GitHub's servers to write ONE original Arabic
# article (prompt: .github/prompts/daily-article.md) and push it to main.
# Replaces the local scheduled task so articles publish even when the PC is off.
on:
  schedule:
    # 6 runs/day: Cairo 9, 11, 14, 17, 20, 22 (UTC+3). Cut from 10 on
    # 2026-09-17 after measuring a full afternoon: eight consecutive runs
    # published NOTHING (three articles had already gone out that morning),
    # and the fruitless ones are the EXPENSIVE ones — a run that finds its
    # story stops early, a run that does not keeps widening the search. They
    # cost 5-21 minutes each of the same Claude quota that the upgrade and
    # sources passes need. Six slots still catch a breaking story within
    # ~3 hours, which is what a daily-article schedule is for.
    #
    # The PRIMARY trigger is the Cloudflare Worker cron ("0 6,8,11,14,17,19"
    # in wrangler.toml, matched EXACTLY in worker.js) - exact and reliable,
    # added after GitHub silently SKIPPED the 17:00 UTC slot on 2026-08-26.
    # This schedule is only the 30-min-late FALLBACK: when the CF run already
    # published, this run finds no fresh story and skips (dedup guards it).
    - cron: "30 6,8,11,14,17,19 * * *"
  workflow_dispatch:              # manual test runs from the Actions tab

permissions:
  contents: write                # Claude commits the article + image
  actions: write                 # dispatch publish.yml afterwards (GITHUB_TOKEN pushes don't trigger on:push)

# Never two article runs at once (duplicate-article risk); never cancel a
# run that may be mid-publish.
concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  write-article:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # data/'s fetch outputs live in the data store, not in git (step 3,
      # 2026-09-24; data_store.py). Without them this job has nothing to read.
      - name: Pull the working data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python data_store.py pull

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install googlenewsdecoder pillow

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # fb_post.py posts only when the top article id CHANGES during this
      # run, so remember it before Claude writes anything.
      - name: Remember newest article id
        run: |
          PREV_ID=$(python -c "import json; items=json.load(open('data/articles.json',encoding='utf-8'))['results'][0]['items']; print(items[0]['article_id'] if items else '')")
          echo "PREV_ARTICLE_ID=$PREV_ID" >> "$GITHUB_ENV"
          echo "HEAD_BEFORE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # An earlier slot may have finished an article that D1 then refused -
      # its free tier has a daily row-READ limit and it ran out on 2026-09-16
      # and again on 2026-09-19, the second time discarding a validated
      # 545-word piece at the INSERT. article_put.py parks such a draft under
      # drafts/ (see PENDING_DIR there); this publishes it before the run goes
      # looking for anything new. Deterministic, no model time, and a no-op on
      # a normal run.
      - name: Publish a parked draft
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
        run: |
          python article_put.py --retry-pending
          if [ -n "$(git status --porcelain data/articles.json drafts)" ]; then
          git config user.name "yalla-score-bot"
          git config user.email "actions@users.noreply.github.com"
            git add data/articles.json drafts
            git commit -m "Yalla Score: publish the draft D1 refused on an earlier slot"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "### 📤 نُشرت مسودة من تشغيل سابق" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ~13 seconds, no model: the same thirteen Google News queries the
      # prompt would fetch anyway, clustered with the site's own logic and
      # checked against the archive, written to /tmp/story_candidates.json.
      # The run starts from that shortlist instead of going to look.
      #
      # It is a BRIEFING, NOT A GATE - story_scan.py's docstring has the
      # measurements for why a gate is not built: 64 stories carry 2+
      # outlets and 63 are not on the site (no discrimination), and the
      # articles-per-day counts 8/7/2/8/4 over 09-14..09-18 predict nothing.
      # continue-on-error + the prompt's own fallback mean a failure here
      # costs nothing: the run searches for itself exactly as before.
      - name: Shortlist today's stories
        continue-on-error: true
        run: python story_scan.py

      # ONE Claude account since 2026-09-12 (the second-account failover was
      # removed on the user's decision). continue-on-error keeps the run green
      # when the account is out of quota: the next slot simply retries.
      - name: Write today's article
        id: write
        continue-on-error: true
        # 15, not 12. The 12 was set on 2026-09-17 on the estimate that "a
        # run that finds its story is done in 5-7 minutes" - and that estimate
        # was wrong. Measured on 2026-09-18 by matching run starts to the
        # commits they produced: the three runs that PUBLISHED took 8.4, 9.8
        # and 10.6 minutes. A 12-minute cap left ~1.4 minutes of headroom over
        # a normal successful run, which means the next slow-but-productive
        # run gets killed after doing all of the work.
        #
        # The cap is not the cost lever anyway - it bounds the damage (an
        # uncapped fruitless search ran 21.6 minutes on 09-17 before the user
        # cancelled it by hand) while the shortlist step above is what should
        # actually shorten the runs. A timeout here fails the step, and
        # continue-on-error above keeps the run green: the next slot retries.
        timeout-minutes: 15
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
        run: |
          # tee the transcript so Claude's closing report (article written, or
          # "no new story" + why) lands in the job Summary - no log digging.
          # pipefail keeps claude's own exit code for the outcome check below.
          set -o pipefail
          # stream-json + claude_trace.py: a live one-line-per-tool-call trace
          # in this log (so a hung or cancelled run still shows its last step),
          # the raw events at /tmp/claude.jsonl, and the final report at
          # /tmp/claude.txt exactly as the summary block below expects.
          claude -p "$(cat .github/prompts/daily-article.md)" \
            --model claude-sonnet-5 \
            --dangerously-skip-permissions \
            --output-format stream-json --verbose \
            | python .github/scripts/claude_trace.py
          {
            echo "### تقرير Claude"
            echo '```'
            tail -n 40 /tmp/claude.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # If D1 refused the INSERT, article_put.py parked the finished draft
      # under drafts/ rather than losing it - but the runner is thrown away at
      # the end of the job, so it has to be committed here, together with the
      # image the article needs. On a normal run Claude has already committed
      # and these paths are clean, so this does nothing.
      - name: Keep a draft D1 refused
        if: always()
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain drafts)" ]; then
            echo "no parked draft this run"
            exit 0
          fi
          git config user.name "yalla-score-bot"
          git config user.email "actions@users.noreply.github.com"
          git add drafts media
          git commit -m "Yalla Score: park the article D1 refused (published next slot)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "::warning::D1 refused the insert - the finished article is parked in drafts/ and the next slot publishes it."
          echo "### 💾 مسودة محفوظة — تُنشر في التشغيل التالي" >> "$GITHUB_STEP_SUMMARY"

      # One-line verdict for the Summary page: new article (title) or none.
      - name: Report outcome
        if: always()
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_BEFORE" ]; then
            TITLE=$(python -c "import json; print(json.load(open('data/articles.json',encoding='utf-8'))['results'][0]['items'][0]['title'])")
            echo "## ✅ مقال جديد: $TITLE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ⏭ لا مقال هذا التشغيل - السبب في تقرير Claude أعلاه" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Claude step failed (quota, expired token, crash) = no article this
      # slot, but NOT a broken pipeline: the next slot retries. Stay green so
      # the run list stays meaningful, but leave a loud marker so a REAL
      # outage (expired token) is visible.
      - name: Flag a failed Claude step
        if: steps.write.outcome == 'failure'
        run: |
          echo "::warning::The Claude step failed (exit code non-zero) - check the account's quota / token if this repeats."
          echo "### ⚠️ Claude step failed this run" >> "$GITHUB_STEP_SUMMARY"

      # Carry the Claude step's REAL outcome to the Worker's watchdog (health.js).
      # This run stays green on a failure (the next slot retries - the user's
      # rule), and GitHub reports a failed continue-on-error step as "success"
      # everywhere, so without this nobody sees three failures in a row until
      # the site stops getting articles. The watchdog pages at three.
      - name: Heartbeat
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
        run: python heartbeat.py article:daily --outcome "${{ steps.write.outcome }}"

      # The Facebook post of a new article now happens in publish.yml AFTER the
      # deploy (fb_post.py --auto) - posting here, before the page was live,
      # gave the post a permanent 404 preview (2026-09-03).

      # publish.yml deploys the tip of main. A push made with GITHUB_TOKEN does
      # NOT fire its on:push trigger, so dispatch it explicitly; without this
      # the article would wait for the next 15-min refresh slot.
      # ONLY when an article was actually committed (2026-09-12). Dispatching
      # on every run was one half of a loop: publish.yml dispatched this
      # workflow whenever a candidate existed, this dispatched publish.yml even
      # when Claude wrote nothing, and the two ping-ponged every ~2 minutes for
      # three hours on 2026-09-11 (23 bot dispatches an hour). The other half
      # is gone too (publish.yml no longer dispatches match-article), but a
      # run that produced nothing has nothing to publish either way.
      - name: Dispatch publish workflow
        if: always()
        run: |
          if [ "$(git rev-parse HEAD)" = "$HEAD_BEFORE" ]; then
            echo "no article was committed this run - not dispatching publish"
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish.yml/dispatches" \
            -d '{"ref":"main","inputs":{"reason":"article"}}'
