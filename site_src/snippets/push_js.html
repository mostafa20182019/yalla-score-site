<script>
/* web push (2026-09-27): the bell in the header and the line under an article.
   Nothing happens until a reader TAPS one of them - no permission prompt on page
   load (Chrome demotes sites that ask unprompted and get refused), and the
   service worker is registered on that tap too. push_send.py does the sending;
   the Worker's /push/subscribe keeps the subscription in D1. */
(function(){
  var KEY='__VAPID_PUBLIC_KEY__';
  var btns=[].slice.call(document.querySelectorAll('.push-btn'));
  if(!btns.length||!KEY)return;
  var ua=navigator.userAgent||'';
  var can=('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);
  var ios=/iP(hone|ad|od)/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var inapp=/FBAN|FBAV|FB_IAB|Instagram|Line\/|; wv\)/.test(ua);
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  /* show the buttons only where a tap can lead somewhere: a browser that can
     subscribe, or Safari on an iPhone (the tap explains the home-screen step).
     The Facebook/Instagram in-app browsers can do neither. */
  if(inapp||!(can||(ios&&!standalone)))return;
  btns.forEach(function(b){b.hidden=false;});
  /* growth plan week 1 (2026-10-08): the article-end line appears from the
     reader's SECOND page in this session - a first-time visitor sees the
     bell only; the ask comes after the site has shown it is worth it */
  var cta=document.querySelector('.push-cta');
  if(cta){var pv=1;try{pv=(parseInt(sessionStorage.getItem('ys_pv')||'0',10)||0)+1;sessionStorage.setItem('ys_pv',String(pv));}catch(e){}
    if(pv>=2)cta.hidden=false;}
  var busy=false,tmr=null;
  function toast(msg){
    var t=document.querySelector('.push-toast');
    if(!t){t=document.createElement('div');t.className='push-toast';t.setAttribute('role','status');document.body.appendChild(t);}
    t.textContent=msg;t.hidden=false;clearTimeout(tmr);
    tmr=setTimeout(function(){t.hidden=true;},6000);
  }
  function mark(on){
    btns.forEach(function(b){
      b.classList.toggle('is-on',on);
      b.setAttribute('aria-pressed',on?'true':'false');
      var l=b.querySelector('.push-lbl');if(l)l.textContent=on?'الإشعارات مفعّلة':'فعّل الإشعارات';
      b.title=on?'الإشعارات مفعّلة — اضغط للإيقاف':'فعّل إشعارات الأخبار';
    });
  }
  function key(s){
    s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';
    var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;
  }
  function post(path,body){
    return fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r;});
  }
  function current(){
    return navigator.serviceWorker.getRegistration('/').then(function(reg){return reg?reg.pushManager.getSubscription():null;});
  }
  if(can)current().then(function(s){mark(!!s);}).catch(function(){});
  function on(){
    /* requestPermission FIRST and straight from the tap: Safari refuses a
       prompt that is not the direct result of a user gesture */
    return Notification.requestPermission().then(function(p){
      if(p!=='granted')throw new Error('perm:'+p);
      return navigator.serviceWorker.register('/sw.js',{scope:'/'});
    }).then(function(){return navigator.serviceWorker.ready;})
      .then(function(reg){
        return reg.pushManager.getSubscription().then(function(s){
          return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key(KEY)});
        });
      })
      .then(function(sub){return post('/push/subscribe',sub.toJSON());})
      .then(function(){mark(true);toast('تم تفعيل الإشعارات 🔔 سيصلك إشعار فور نشر خبر جديد.');});
  }
  function off(){
    return current().then(function(s){
      if(!s)return;
      var ep=s.endpoint;
      return s.unsubscribe().then(function(){return post('/push/unsubscribe',{endpoint:ep}).catch(function(){});});
    }).then(function(){mark(false);toast('تم إيقاف الإشعارات.');});
  }
  btns.forEach(function(b){b.addEventListener('click',function(){
    if(!can){
      toast('على آيفون: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»، وافتح يلا سكور من الأيقونة الجديدة وفعّل الإشعارات من هناك.');
      return;
    }
    if(Notification.permission==='denied'){
      toast('الإشعارات محظورة لهذا الموقع — فعّلها من إعدادات المتصفح (رمز القفل بجوار العنوان) ثم اضغط الجرس مرة أخرى.');
      return;
    }
    if(busy)return;busy=true;
    (b.classList.contains('is-on')?off():on()).catch(function(e){
      var m=String(e&&e.message||'');
      if(m.indexOf('perm:')===0)toast('لم يتم التفعيل — يمكنك تفعيل الإشعارات في أي وقت من زر الجرس.');
      else toast('تعذّر تفعيل الإشعارات الآن، حاول مرة أخرى بعد قليل.');
    }).then(function(){busy=false;});
  });});
})();
</script>
