<script>
(function(){
  /* the team card (2026-11-13, user: «فى جداول الترتيب لما اضغط على نادى او
     منتخب يجيب بيانات عنه»). The team's name in any standings table is a
     button (.lt-tb). The card reads the row's own cells - position, played,
     won, drawn, lost, goals for/against, difference, points (the phone layout
     hides some of them) and its last-5 dots - and the row's data-tc, built
     from our data: the last result, the next match, the club's top scorer in
     this competition, its club page. Nothing is fetched; nothing is guessed.
     Escape, the × and the backdrop close it; focus goes back to the name. */
  if(!document.querySelector('.lt-tb')) return;
  var pop=document.createElement('div');
  pop.className='lt-pop tc-pop'; pop.hidden=true;
  pop.innerHTML='<div class="lt-pop-box" role="dialog" aria-modal="true" aria-label="بطاقة الفريق">'
    +'<div class="lt-pop-h"><b>بطاقة الفريق</b><button type="button" class="lt-pop-x" aria-label="إغلاق">×</button></div>'
    +'<div class="tc-b"></div></div>';
  document.body.appendChild(pop);
  var body=pop.querySelector('.tc-b'), last=null;
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function txt(td){ return td?(td.textContent||'').trim():''; }
  var RES={w:['فوز','tc-w'],d:['تعادل','tc-d'],l:['خسارة','tc-l']};
  /* the team's match RIGHT NOW (2026-11-13, user: «خلى ... البطاقة لحظية»):
     from the reply LIVE_JS already polls (window.__lvGames, refreshed on
     'lv:update'), inside the table's own competition only (data-cid), names
     compared the way LIVE_JS compares them. A live match shows its score and
     minute; one that ended and is not yet the row's «آخر نتيجة» (the site
     rebuilds after the whistle) shows as just finished. Nothing else moves:
     the table's numbers change only with the official standings. */
  function norm(s){return(s||'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[.'’]/g,'').replace(/\s+/g,'');}
  var cur=null;
  function liveHtml(){
    if(!cur) return '';
    var gs=window.__lvGames||[], nm=norm(cur.name), cid=cur.cid;
    if(!cid) return '';
    var g=null;
    for(var i=0;i<gs.length;i++){
      var x=gs[i];
      if(String(x.c)!==String(cid)) continue;
      if(norm(x.h)===nm||norm(x.a)===nm){ if(x.live){ g=x; break; } if(!g) g=x; }
    }
    if(!g) return '';
    var c=cur.c||{};
    if(!g.live){
      /* already the row's last result = nothing new to say */
      if(c.ls&&norm(c.ls.h)===norm(g.h)&&norm(c.ls.a)===norm(g.a)&&c.ls.s===(g.hs+' - '+g.as)) return '';
    }
    var url='';
    [c.nx,c.ls].forEach(function(m){ if(!url&&m&&m.u&&norm(m.h)===norm(g.h)&&norm(m.a)===norm(g.a)) url=m.u; });
    var inner='<span class="tc-lv-p'+(g.live?' on':'')+'">'+(g.live?'مباشر الآن':'انتهت للتو')+'</span>'
      +'<span class="tc-lv-m"><bdi>'+esc(g.h)+'</bdi> <b>'+esc(g.hs)+' - '+esc(g.as)+'</b> <bdi>'+esc(g.a)+'</bdi></span>'
      +(g.live&&g.min?'<span class="tc-lv-min">'+esc(g.min)+'</span>':'');
    return url?'<a class="tc-live" href="'+esc(url)+'">'+inner+'</a>':'<div class="tc-live">'+inner+'</div>';
  }
  function paintLive(){
    var box=body.querySelector('.tc-lv'); if(box) box.innerHTML=liveHtml();
  }
  document.addEventListener('lv:update',function(){ if(!pop.hidden) paintLive(); });
  function open(btn){
    var tr=btn.closest('tr'), table=btn.closest('.ltable'); if(!tr) return;
    var td=tr.children, n=td.length;
    /* the numbers from the END of the row: …, لعب, ف, ت, خ, له, عليه, +/-, نقاط */
    var v={pts:txt(td[n-1]),gd:txt(td[n-2]),ga:txt(td[n-3]),gf:txt(td[n-4]),
           l:txt(td[n-5]),d:txt(td[n-6]),w:txt(td[n-7]),p:txt(td[n-8]),pos:txt(td[0])};
    var c={}; try{ c=JSON.parse(tr.getAttribute('data-tc')||'{}'); }catch(e){ c={}; }
    var name=txt(btn.querySelector('bdi')), img=btn.querySelector('img');
    var league=(table&&table.getAttribute('data-cl'))||'';
    cur={name:name,cid:(table&&table.getAttribute('data-cid'))||'',c:c};
    var h='<div class="tc-top">'+(img?'<img src="'+esc(img.getAttribute('src'))+'" alt="" width="52" height="52">':'')
      +'<div class="tc-who"><b class="tc-n">'+esc(name)+'</b>'
      +(v.pos?'<span class="tc-m">المركز '+esc(v.pos)+(league?' في '+esc(league):'')+'</span>':'')+'</div>'
      +(v.pts!==''?'<span class="tc-pts"><b>'+esc(v.pts)+'</b>نقطة</span>':'')+'</div>'
      +'<div class="tc-lv">'+liveHtml()+'</div>';
    h+='<div class="tc-grid">'
      +[['لعب',v.p],['فوز',v.w],['تعادل',v.d],['خسارة',v.l],['له',v.gf],['عليه',v.ga],['الفارق',v.gd],
        ['النقاط/مباراة',(+v.p>0?((+v.pts)/(+v.p)).toFixed(2):'—')]]
        .map(function(x){return '<div><b dir="ltr">'+esc(x[1])+'</b><span>'+x[0]+'</span></div>';}).join('')
      +'</div>';
    var fm=tr.querySelector('.lt-form');
    if(fm&&fm.querySelector('.fm'))h+='<div class="tc-row"><span class="tc-k">آخر 5 مباريات</span><span class="tc-form">'+fm.innerHTML+'</span></div>';
    function line(k,body,url){
      return '<div class="tc-row"><span class="tc-k">'+k+'</span>'
        +(url?'<a class="tc-v" href="'+esc(url)+'">'+body+' ←</a>':'<span class="tc-v">'+body+'</span>')+'</div>';
    }
    if(c.ls){
      var r=RES[c.ls.r]||['',''];
      /* the score with spaces between two names: each number stays on its side */
      h+=line('آخر نتيجة',(r[0]?'<i class="tc-r '+r[1]+'">'+r[0]+'</i> ':'')
        +'<bdi>'+esc(c.ls.h)+'</bdi> '+esc(c.ls.s)+' <bdi>'+esc(c.ls.a)+'</bdi>'
        +(c.ls.d?' <small>'+esc(c.ls.d)+'</small>':''),c.ls.u);
    }
    if(c.nx){
      h+=line('المباراة القادمة','<bdi>'+esc(c.nx.h)+'</bdi> × <bdi>'+esc(c.nx.a)+'</bdi>'
        +(c.nx.d?' <small>'+esc(c.nx.d)+(c.nx.t?' · '+esc(c.nx.t):'')+'</small>':''),c.nx.u);
    }
    if(c.sc)h+=line('الهداف',esc(c.sc.n)+' <small>('+esc(c.sc.g)+')</small>');
    if(c.tp)h+='<a class="tc-more" href="'+esc(c.tp)+'">صفحة '+esc(name)+': الأخبار والمباريات ←</a>';
    body.innerHTML=h;
    last=btn; pop.hidden=false; document.documentElement.classList.add('lt-lock');
    pop.querySelector('.lt-pop-x').focus();
  }
  function close(){ pop.hidden=true; document.documentElement.classList.remove('lt-lock'); if(last) last.focus(); }
  pop.addEventListener('click',function(e){ if(e.target===pop||e.target.closest('.lt-pop-x')) close(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!pop.hidden) close(); });
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('.lt-tb'); if(!b) return;
    e.preventDefault(); open(b);
  });
})();
</script>
