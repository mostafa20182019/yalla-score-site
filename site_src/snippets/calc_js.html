<script>
/* «حاسبة الترتيب» (2026-11-19): /calc/<slug>. The page's JSON (#calcData) is
   the saved table and the matches still to play; the reader picks home win /
   draw / away win per match and the table is re-added and re-sorted here, in
   the browser. A win counts 1-0 and a draw 1-1 (the page says so). The picks
   are kept in this browser only (localStorage), per league. Every name is
   written with textContent - nothing from the feed is ever parsed as HTML. */
(function(){
  var root=document.getElementById('calc'), src=document.getElementById('calcData');
  if(!root||!src) return;
  var D; try{ D=JSON.parse(src.textContent); }catch(e){ return; }
  if(!D||!D.teams||!D.rounds||!D.rounds.length) return;
  var KEY='elgoonCalc:'+(root.getAttribute('data-slug')||''), picks={}, ri=0;
  try{ picks=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ picks={}; }
  /* a pick for a match that left the list (it kicked off) is no longer a
     pick to change: it moves to `past` - {match: [pick, when it moved]} - and
     waits for the final score (D.done, «نتيجة توقعاتك»). It is forgotten
     once the page no longer carries the match and two weeks have gone. */
  var live={}; D.rounds.forEach(function(r){ r.m.forEach(function(m){ live[m[0]]=1; }); });
  var past={}, done={}, NOW=Date.now();
  (D.done||[]).forEach(function(x){ done[x[0]]=x; });
  try{ past=JSON.parse(localStorage.getItem(KEY+':past')||'{}')||{}; }catch(e){ past={}; }
  Object.keys(picks).forEach(function(k){
    if('hda'.indexOf(picks[k])<0||picks[k].length!==1){ delete picks[k]; return; }
    if(!live[k]){ past[k]=[picks[k],NOW]; delete picks[k]; }
  });
  Object.keys(past).forEach(function(k){
    var p=past[k];
    if(!p||'hda'.indexOf(p[0])<0||(!done[k]&&!(NOW-p[1]<14*864e5))) delete past[k];
  });
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(picks)); localStorage.setItem(KEY+':past',JSON.stringify(past)); }catch(e){} }
  save();
  /* «شارك توقعك» (site review 2026-11-19): the picks ride in the link's
     fragment - #p=<match>.<h|d|a>,... - so a friend opens the same table.
     A fragment never reaches a server; only known matches and h/d/a are read. */
  function link(){
    var ks=Object.keys(picks).sort();
    return location.origin+location.pathname+(ks.length?'#p='+ks.map(function(k){ return k+'.'+picks[k]; }).join(','):'');
  }
  (function(){
    var h=location.hash||''; if(h.indexOf('#p=')!==0) return;
    var got={}, n=0;
    h.slice(3).split(',').forEach(function(x){
      var m=/^([A-Za-z0-9-]{1,24})\.([hda])$/.exec(x);
      if(m&&live[m[1]]){ got[m[1]]=m[2]; n++; }
    });
    if(n){ picks=got; save(); }
  })();
  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  function crest(t){ var s=el('span','calc-cr'); if(t.c){ var i=document.createElement('img'); i.src=t.c; i.alt=''; i.width=24; i.height=24; i.loading='lazy'; s.appendChild(i); } return s; }

  var elRound=document.getElementById('calcRound'), elMs=document.getElementById('calcMatches'),
      elBody=document.getElementById('calcBody'), elCount=document.getElementById('calcCount'),
      elReset=document.getElementById('calcReset'), prev=root.querySelector('.calc-prev'), next=root.querySelector('.calc-next'),
      elShare=document.getElementById('calcShare'), elFx=document.getElementById('calcFx'), elFxT=document.getElementById('calcFxText'), elFxGo=document.getElementById('calcFxGo');

  function table(){
    var rows=D.teams.map(function(t,i){ return {i:i,n:t.n,c:t.c,p:t.p,w:t.w,d:t.d,l:t.l,gf:t.gf,ga:t.ga,pts:t.pts,ch:0}; });
    D.rounds.forEach(function(r){ r.m.forEach(function(m){
      var v=picks[m[0]]; if(!v) return;
      var h=rows[m[1]], a=rows[m[2]]; h.p++; a.p++; h.ch=a.ch=1;
      if(v==='h'){ h.w++; a.l++; h.pts+=3; h.gf++; a.ga++; }
      else if(v==='a'){ a.w++; h.l++; a.pts+=3; a.gf++; h.ga++; }
      else { h.d++; a.d++; h.pts++; a.pts++; h.gf++; h.ga++; a.gf++; a.ga++; }
    }); });
    rows.sort(function(x,y){ return (y.pts-x.pts)||((y.gf-y.ga)-(x.gf-x.ga))||(y.gf-x.gf)||(x.i-y.i); });
    return rows;
  }
  function drawTable(){
    var rows=table(); elBody.textContent='';
    rows.forEach(function(r,pos){
      var tr=el('tr', r.ch?'calc-ch':'');
      tr.appendChild(el('td','calc-pos',String(pos+1)));
      /* dir=ltr on the two cells that hold ONE signed number: in an RTL cell
         «+15» drew as «15+» and «▲1» as «1▲» */
      var mv=r.i-pos, m=el('td','calc-mv'+(mv>0?' up':mv<0?' dn':''), mv>0?'▲'+mv:mv<0?'▼'+(-mv):'');
      m.setAttribute('dir','ltr');
      if(mv) m.setAttribute('aria-label',(mv>0?'صعد ':'هبط ')+Math.abs(mv));
      tr.appendChild(m);
      var nm=el('td','calc-tm'), w=el('span','calc-tmw'); w.appendChild(crest(r)); w.appendChild(el('bdi','',r.n)); nm.appendChild(w); tr.appendChild(nm);
      tr.appendChild(el('td','',String(r.p)));
      var gd=r.gf-r.ga, g=el('td','calc-gd',(gd>0?'+':'')+gd); g.setAttribute('dir','ltr'); tr.appendChild(g);
      tr.appendChild(el('td','calc-pts',String(r.pts)));
      elBody.appendChild(tr);
    });
    return rows;
  }
  /* the table sits a screen below the buttons on a phone: say what the pick
     just did, where the reader's thumb is */
  function effect(m,rows){
    if(!elFx||!elFxT) return;
    if(!m||!picks[m[0]]){ elFx.hidden=true; return; }
    elFxT.textContent='';
    [m[1],m[2]].forEach(function(ti,k){
      var pos=-1; rows.forEach(function(r,p){ if(r.i===ti) pos=p; });
      if(pos<0) return;
      if(k) elFxT.appendChild(document.createTextNode(' · '));
      elFxT.appendChild(el('bdi','',D.teams[ti].n));
      elFxT.appendChild(document.createTextNode(': المركز '+(pos+1)));
      var mv=ti-pos;
      if(mv){ var a=el('i',mv>0?'up':'dn',mv>0?'▲'+mv:'▼'+(-mv)); a.setAttribute('dir','ltr'); elFxT.appendChild(a); }
    });
    elFx.hidden=false;
  }
  /* «ماذا لو؟» (2026-11-25): one match in front of everything else. Which
     one: the match a door named (#m=<key> or #m=<key>.<h|a> - the side is the
     reader's team), else the leader's nearest match, else the first match. */
  var hero=document.getElementById('calcHero'), elQ=document.getElementById('calcQ'), elHB=document.getElementById('calcHeroBtns'),
      elAns=document.getElementById('calcAns'), elHW=document.getElementById('calcHeroWhen'), elHGo=document.getElementById('calcHeroGo');
  var FM=null, FS='', DOOR=false;      /* the hero is for a reader a club's door sent (#m=) */
  (function(){
    var byKey={}, first=null, lead=null;
    D.rounds.forEach(function(r,i){ r.m.forEach(function(m){
      var f={m:m,ri:i}; byKey[m[0]]=f; if(!first) first=f; if(!lead&&(m[1]===0||m[2]===0)) lead=f;
    }); });
    var x=/^#m=([A-Za-z0-9-]{1,24})(?:\.([ha]))?$/.exec(location.hash||''), f=x&&byKey[x[1]];
    if(f){ FS=x[2]||''; ri=f.ri; DOOR=true; } else f=lead||first;
    /* «توقّع وشارك» names the round the reader was looking at: #r=<n> */
    var rn=/^#r=(\d{1,3})$/.exec(location.hash||'');
    if(rn) D.rounds.forEach(function(r,i){ if(r.r===+rn[1]) ri=i; });
    FM=f?f.m:null;
  })();
  var ORD=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'];
  function place(n){ return 'المركز '+(ORD[n-1]||n); }
  function points(n){ return n===1?'نقطة واحدة':n===2?'نقطتان':n<=10?n+' نقاط':n+' نقطة'; }
  function drawHero(rows){
    if(!hero||!elQ||!elHB||!elAns||!FM) return;
    rows=rows||table();
    var h=D.teams[FM[1]], a=D.teams[FM[2]], v=picks[FM[0]];
    elQ.textContent='';
    if(FS){
      var me=FS==='h'?h:a, op=FS==='h'?a:h;
      elQ.appendChild(document.createTextNode('ماذا لو فاز ')); elQ.appendChild(el('bdi','',me.n));
      elQ.appendChild(document.createTextNode(' على ')); elQ.appendChild(el('bdi','',op.n));
      elQ.appendChild(document.createTextNode('؟'));
    } else {
      elQ.appendChild(el('bdi','',h.n)); elQ.appendChild(document.createTextNode(' × ')); elQ.appendChild(el('bdi','',a.n));
      elQ.appendChild(document.createTextNode(': ماذا لو؟'));
    }
    if(elHW) elHW.textContent=FM[3]||'';
    elHB.textContent='';
    [['h','فوز '+h.n],['d','تعادل'],['a','فوز '+a.n]].forEach(function(o){
      var b=el('button','calc-hb'+(v===o[0]?' on':''),(v===o[0]?'✓ ':'')+o[1]); b.type='button';
      b.setAttribute('aria-pressed',v===o[0]?'true':'false');
      b.addEventListener('click',function(){
        if(picks[FM[0]]===o[0]) delete picks[FM[0]]; else picks[FM[0]]=o[0];
        save(); drawRound(); drawHero(drawTable()); effect(null); count();
      });
      elHB.appendChild(b);
    });
    elAns.textContent='';
    if(elHGo) elHGo.hidden=!v;
    if(!v){ elAns.className='calc-ans is-empty'; elAns.textContent='اختر نتيجة، وشاهد أين يصبح الفريقان في الترتيب.'; return; }
    elAns.className='calc-ans';
    (FS==='a'?[FM[2],FM[1]]:[FM[1],FM[2]]).forEach(function(ti){
      var pos=-1, pts=0; rows.forEach(function(r,p){ if(r.i===ti){ pos=p; pts=r.pts; } });
      if(pos<0) return;
      var mv=ti-pos, line=el('div','calc-al'+(mv>0?' up':mv<0?' dn':''));
      line.appendChild(el('bdi','',D.teams[ti].n));
      line.appendChild(document.createTextNode((mv>0?' يصعد إلى ':mv<0?' يتراجع إلى ':' يبقى في ')+place(pos+1)+' · '+points(pts)));
      elAns.appendChild(line);
    });
  }
  /* the two images (2026-11-25): the picks of the round on screen, and the
     table after every pick - drawn by the «صورة» script (window.elgoonShot) */
  var shotP=document.getElementById('calcShotP'), shotT=document.getElementById('calcShotT'),
      LABEL=root.getAttribute('data-label')||'', ICON=root.getAttribute('data-icon')||'';
  if(shotP) shotP.addEventListener('click',function(){
    var S=window.elgoonShot, r=D.rounds[ri]; if(!S) return;
    var rows=r.m.filter(function(m){ return picks[m[0]]; }).map(function(m){
      var h=D.teams[m[1]], a=D.teams[m[2]]; return {h:h.n, a:a.n, hc:h.c, ac:a.c, v:picks[m[0]]}; });
    if(rows.length) S.picks(shotP,{label:LABEL, icon:ICON, what:'الجولة '+r.r, rows:rows});
  });
  if(shotT) shotT.addEventListener('click',function(){
    var S=window.elgoonShot; if(!S) return;
    S.table(shotT,{label:LABEL, icon:ICON, what:Object.keys(picks).length?'الترتيب بعد توقعاتي':'جدول الترتيب',
      rows:table().map(function(r,p){ var gd=r.gf-r.ga;
        return {pos:String(p+1), name:r.n, crest:r.c, n:[r.p,r.w,r.d,r.l,(gd>0?'+':'')+gd,r.pts].map(String)}; })});
  });
  /* «نتيجة توقعاتك»: his picks on the latest round that has final scores */
  var resBox=document.getElementById('calcRes'), resRows=[], resWhat='';
  (function(){
    var mine=Object.keys(past).filter(function(k){ return done[k]; }).map(function(k){
      var x=done[k], v=past[k][0], real=x[6]>x[7]?'h':x[6]<x[7]?'a':'d';
      return {r:x[1], h:x[2], a:x[3], hc:x[4], ac:x[5], hs:String(x[6]), as:String(x[7]), v:v, ok:v===real};
    });
    if(!resBox||!mine.length) return;
    var rmax=Math.max.apply(null,mine.map(function(d){ return d.r; }));
    resRows=mine.filter(function(d){ return d.r===rmax; });
    var hit=resRows.filter(function(d){ return d.ok; }).length, n=resRows.length;
    resWhat='الجولة '+rmax+' · '+hit+' من '+n;
    var t=document.getElementById('calcResT'), nEl=document.getElementById('calcResN'), l=document.getElementById('calcResL');
    if(t) t.textContent='نتيجة توقعاتك في الجولة '+rmax;
    if(nEl) nEl.textContent=n===1?(hit?'توقعك صحيح.':'توقعك لم يصب.'):('أصبت في '+hit+' من '+n+'.');
    if(l){
      l.textContent='';
      resRows.forEach(function(d){
        var row=el('div','calc-rr '+(d.ok?'ok':'no')), sc=el('span','calc-rs');
        row.appendChild(el('span','calc-rk',d.ok?'✓':'✗'));
        var mt=el('span','calc-rm');
        mt.appendChild(el('bdi','',d.h));
        /* three boxes, never one text: the home goals stay on the home side */
        sc.appendChild(el('b','',d.hs)); sc.appendChild(el('i','','-')); sc.appendChild(el('b','',d.as));
        mt.appendChild(sc); mt.appendChild(el('bdi','',d.a));
        row.appendChild(mt);
        var say=el('span','calc-rp'); say.appendChild(document.createTextNode('توقعت: '));
        if(d.v==='d') say.appendChild(document.createTextNode('تعادل'));
        else{ say.appendChild(document.createTextNode('فوز ')); say.appendChild(el('bdi','',d.v==='h'?d.h:d.a)); }
        row.appendChild(say);
        l.appendChild(row);
      });
    }
    resBox.hidden=false;
  })();
  var shotR=document.getElementById('calcShotR');
  if(shotR) shotR.addEventListener('click',function(){
    var S=window.elgoonShot; if(!S||!resRows.length) return;
    S.result(shotR,{label:LABEL, icon:ICON, what:resWhat, rows:resRows});
  });
  function drawRound(){
    var r=D.rounds[ri], lastW=null; elRound.textContent='الجولة '+r.r; elMs.textContent='';
    r.m.forEach(function(m){
      /* the day and hour ONCE above the matches that share them, not under
         every match: a round was 1267 px tall on a phone */
      if(m[3]&&m[3]!==lastW){ elMs.appendChild(el('div','calc-d',m[3])); lastW=m[3]; }
      var h=D.teams[m[1]], a=D.teams[m[2]], row=el('div','calc-m'), v=picks[m[0]];
      var hs=el('span','calc-h'+(v==='h'?' calc-win':'')); hs.appendChild(crest(h)); hs.appendChild(el('bdi','',h.n)); row.appendChild(hs);
      var bs=el('span','calc-btns'); bs.setAttribute('role','group'); bs.setAttribute('aria-label','نتيجة '+h.n+' و'+a.n);
      [['h','فوز','فوز '+h.n],['d','تعادل','تعادل'],['a','فوز','فوز '+a.n]].forEach(function(o){
        /* the two «فوز» buttons read the same: the picked one is ticked and the winner's name goes bold */
        var b=el('button','calc-b'+(v===o[0]?' on':''),(v===o[0]?'✓ ':'')+o[1]); b.type='button';
        b.setAttribute('aria-label',o[2]); b.setAttribute('aria-pressed',v===o[0]?'true':'false');
        b.addEventListener('click',function(){
          if(picks[m[0]]===o[0]) delete picks[m[0]]; else picks[m[0]]=o[0];
          save(); drawRound(); effect(m,drawTable()); count(); drawHero();
        });
        bs.appendChild(b);
      });
      row.appendChild(bs);
      var as=el('span','calc-a'+(v==='a'?' calc-win':'')); as.appendChild(el('bdi','',a.n)); as.appendChild(crest(a)); row.appendChild(as);
      elMs.appendChild(row);
    });
    if(shotP) shotP.hidden=!r.m.some(function(m){ return picks[m[0]]; });
    if(prev){ prev.hidden=false; prev.disabled=ri===0; }
    if(next){ next.hidden=false; next.disabled=ri===D.rounds.length-1; }
  }
  function count(){
    var n=Object.keys(picks).length;
    if(elCount) elCount.textContent=n? ('توقعاتك: '+(n===1?'مباراة واحدة':n===2?'مباراتان':n<=10?n+' مباريات':n+' مباراة')) : 'لم تختر أي نتيجة بعد';
    if(elReset) elReset.hidden=!n;
    if(elShare){
      var u=link(), ttl=document.title;
      elShare.hidden=!n;
      elShare.href='https://wa.me/?text='+encodeURIComponent(ttl+' '+u);
      elShare.setAttribute('data-share-url',u); elShare.setAttribute('data-share-title',ttl);
    }
  }
  if(prev) prev.addEventListener('click',function(){ if(ri>0){ ri--; drawRound(); } });
  if(next) next.addEventListener('click',function(){ if(ri<D.rounds.length-1){ ri++; drawRound(); } });
  if(elReset) elReset.addEventListener('click',function(){ picks={}; save(); drawRound(); drawTable(); effect(null); count(); drawHero(); });
  if(elFxGo) elFxGo.addEventListener('click',function(){
    var t=root.querySelector('.calc-t'); if(t&&t.scrollIntoView) t.scrollIntoView({block:'start'});
  });
  [['calcGoT','.calc-t'],['calcGoM','.calc-nav']].forEach(function(g){
    var b=document.getElementById(g[0]);
    if(b) b.addEventListener('click',function(){ var t=root.querySelector(g[1]); if(t&&t.scrollIntoView) t.scrollIntoView({block:'start'}); });
  });
  root.classList.add('calc-on');
  drawRound(); drawTable(); count();
  if(hero&&FM&&DOOR){ drawHero(); hero.hidden=false; }
})();
</script>
