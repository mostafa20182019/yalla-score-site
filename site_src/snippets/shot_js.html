<script>
/* «صورة» (user, 2026-11-24): the button on a league heading of the day list
   draws ONE image of that league's matches on that day - for readers who post
   football content, with our name on it. Since 2026-11-25 the same button
   sits on every standings table (.ltable) and every scorers / assists chart
   (.sc-list): data-shot = "t" (table) or "s" (chart), none = the day list.
   Drawn in the reader's browser from the rows AS THEY ARE ON SCREEN, so a
   live score is the one the live layer painted a moment ago (no build, no
   server, no stale number). Crests and faces are same-origin (/assets/crests)
   - a canvas with a foreign image cannot be exported, so any other source is
   skipped. Buttons are shown by the .shot-on class: no JS / no canvas = no
   button. Ships in /assets/app.js (every page). */
(function(){
  var cv=document.createElement('canvas');
  if(!cv.getContext||!cv.toBlob) return;
  document.documentElement.classList.add('shot-on');
  var W=1080, PAD=44, FONT="'Almarai','Segoe UI',Tahoma,Arial,sans-serif";
  var INK='#0f172a', MUTED='#5b6b82', LIVE='#e11d48', FIN='#64748b', UP='#1676ad';
  var MAXG=4;                       /* scorers drawn per side */
  var HEAD=236, FOOT=150, GAP=34;
  var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

  function txt(n){ return n?(n.textContent||'').replace(/\s+/g,' ').trim():''; }
  function sameOrigin(u){
    try{ return new URL(u,location.href).origin===location.origin; }catch(e){ return false; }
  }
  function img(u){
    return new Promise(function(res){
      if(!u||!sameOrigin(u)) return res(null);
      var i=new Image();
      i.onload=function(){ res(i.naturalWidth?i:null); };
      i.onerror=function(){ res(null); };
      i.src=u;
    });
  }
  function today(){ var n=new Date(); return n.getDate()+' '+MONTHS[n.getMonth()]+' '+n.getFullYear(); }
  function goalsOf(side){
    if(!side) return [];
    return [].slice.call(side.querySelectorAll('.mg')).map(function(g){
      var t=txt(g.querySelector('small'));
      return {p:txt(g.querySelector('bdi')), m:txt(g.querySelector('.mg-m')), t:t};
    }).filter(function(g){ return g.p; });
  }
  /* one row of the list -> plain data. The score text is «home - away»
     (match_row / LIVE_JS); the two numbers are drawn apart so the home one
     always sits on the home side whatever the text direction does. */
  function rowData(r){
    var live=r.classList.contains('mrow-live'), fin=r.classList.contains('mrow-fin');
    var sc=txt(r.querySelector('.score')), m=/^(\d+)\s*-\s*(\d+)$/.exec(sc);
    var pill=r.querySelector('.pill'), stale=!!(pill&&pill.classList.contains('pill-stale'));
    var hi=r.querySelector('.team.th img'), ai=r.querySelector('.team.ta img');
    var sides=r.querySelectorAll('.mgoals .mg-side');
    var pen=r.querySelector('.mpen b'), pm=pen?/^(\d+)\s*-\s*(\d+)$/.exec(txt(pen)):null;
    return {h:r.getAttribute('data-h')||'', a:r.getAttribute('data-a')||'',
            hc:hi?hi.getAttribute('src'):'', ac:ai?ai.getAttribute('src'):'',
            hs:m?m[1]:null, as:m?m[2]:null, live:live&&!stale, fin:fin, stale:stale,
            min:txt(r.querySelector('.lv-min')), ko:txt(r.querySelector('.ko')),
            ph:pm?pm[1]:null, pa:pm?pm[2]:null,
            gh:goalsOf(sides[0]), ga:goalsOf(sides[1])};
  }
  function fit(c,s,weight,size,min,maxW){    /* shrink, then cut with an ellipsis */
    for(;size>min;size-=2){ c.font=weight+' '+size+'px '+FONT; if(c.measureText(s).width<=maxW) return s; }
    c.font=weight+' '+min+'px '+FONT;
    while(s.length>3&&c.measureText(s+'…').width>maxW) s=s.slice(0,-1);
    return c.measureText(s).width<=maxW?s:s+'…';
  }
  function rr(c,x,y,w,h,r){
    c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
  }
  function contain(c,im,x,y,s){               /* an image inside an s×s box */
    var k=Math.min(s/im.naturalWidth,s/im.naturalHeight), w=im.naturalWidth*k, h=im.naturalHeight*k;
    c.drawImage(im,x+(s-w)/2,y+(s-h)/2,w,h);
  }
  function gLines(list){
    var out=list.slice(0,MAXG).map(function(g){ return g.p+(g.m?'  ⁦'+g.m+'⁩':'')+   /* isolated: «90+7′» must not turn into «7+90» */(g.t?' ('+g.t+')':''); });
    if(list.length>MAXG) out.push('+'+(list.length-MAXG));
    return out;
  }
  function rowH(d){
    var n=Math.max(gLines(d.gh).length,gLines(d.ga).length);
    return 150+(n?n*36+10:0);
  }
  function clock(){
    var n=new Date(), h=n.getHours(), m=n.getMinutes();
    return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  }

  /* the shared frame: the blue heading (league + one line under it), the
     white card `body` px tall centred in what is left, our name at the foot.
     paint(c, top) draws inside the card. */
  function frame(info,pics,body,minH,paint){
    var H=Math.max(minH, HEAD+GAP+body+GAP+FOOT);
    var c=cv.getContext('2d'); cv.width=W; cv.height=H;
    c.fillStyle='#eef2f6'; c.fillRect(0,0,W,H);
    var g=c.createLinearGradient(0,0,W,0); g.addColorStop(0,'#15658f'); g.addColorStop(1,'#1676ad');
    c.fillStyle=g; c.fillRect(0,0,W,HEAD);
    c.direction='rtl'; c.textBaseline='middle';
    var tx=W-PAD;
    if(pics.icon){
      c.fillStyle='#fff'; c.beginPath(); c.arc(W-PAD-58,HEAD/2,58,0,6.2832); c.fill();
      contain(c,pics.icon,W-PAD-58-36,HEAD/2-36,72);
      tx=W-PAD-116-26;
    }
    c.textAlign='right'; c.fillStyle='#fff';
    c.fillText(fit(c,info.label,'900',62,36,tx-PAD),tx,HEAD/2-26);
    c.fillStyle='rgba(255,255,255,.88)';
    c.fillText(fit(c,info.day,'700',32,24,tx-PAD),tx,HEAD/2+44);
    var top=HEAD+GAP+Math.max(0,(H-HEAD-FOOT-2*GAP-body)/2);
    c.fillStyle='#fff'; rr(c,PAD,top,W-2*PAD,body,26); c.fill();
    paint(c,top);
    c.fillStyle='#fff'; c.fillRect(0,H-FOOT,W,FOOT);
    c.fillStyle='#1676ad'; c.fillRect(0,H-FOOT,W,5);
    var fy=H-FOOT/2+2;
    c.textBaseline='middle';
    if(pics.logo){ var lh=92, lw=pics.logo.naturalWidth*lh/pics.logo.naturalHeight; c.drawImage(pics.logo,W-PAD-lw,fy-lh/2,lw,lh); }
    c.direction='ltr'; c.textAlign='left'; c.font='900 40px '+FONT; c.fillStyle='#15658f';
    c.fillText('elgoon.com',PAD,fy-(info.live?16:0));
    if(info.live){
      c.direction='rtl'; c.font='700 24px '+FONT; c.fillStyle=MUTED;
      c.fillText('النتائج حتى الساعة '+clock(),PAD,fy+28);
    }
  }

  /* ---- the day's matches of one league ---- */
  function drawMatches(info,pics){
    var rows=info.rows, hs=rows.map(rowH), body=hs.reduce(function(a,b){return a+b;},0), CX=W/2;
    frame(info,pics,body,1350,function(c,top){
      var y=top;
      rows.forEach(function(d,i){
        var h=hs[i], cy=y+75, CREST=76, MIDW=96;
        if(i){ c.fillStyle='#e6ebf1'; c.fillRect(PAD+24,y,W-2*PAD-48,2); }
        /* home on the right (as on the site), away on the left */
        var hx=CX+MIDW+14, ax=CX-MIDW-14-CREST;
        [[pics.crest[d.hc],hx],[pics.crest[d.ac],ax]].forEach(function(p){
          if(p[0]) contain(c,p[0],p[1],cy-CREST/2,CREST);
          else{ c.fillStyle='#e2e8f0'; c.beginPath(); c.arc(p[1]+CREST/2,cy,CREST/2-4,0,6.2832); c.fill(); }
        });
        var nameW=W-PAD-22-(hx+CREST+16);
        c.fillStyle=INK; c.direction='rtl';
        c.textAlign='left';  c.fillText(fit(c,d.h,'800',38,26,nameW),hx+CREST+16,cy);
        c.textAlign='right'; c.fillText(fit(c,d.a,'800',38,26,nameW),ax-16,cy);
        /* the middle: score + state, or the kick-off time */
        c.textAlign='center';
        if(d.hs!==null){
          c.direction='ltr'; c.font='900 58px '+FONT; c.fillStyle=d.live?LIVE:INK;
          var sy=cy-16;
          c.fillText('-',CX,sy-3);
          c.textAlign='left';  c.fillText(d.hs,CX+24,sy);     /* home = right */
          c.textAlign='right'; c.fillText(d.as,CX-24,sy);
          c.textAlign='center'; c.direction='rtl'; c.font='800 24px '+FONT;
          var st=d.live?('مباشر'+(d.min?' · '+d.min.replace(/[′']/g,'')+'′':'')):(d.stale?'توقف التحديث':'انتهت');
          if(d.ph!==null&&!d.live) st='ترجيح '+d.ph+' - '+d.pa;   /* rtl text: the first number lands right = home */
          c.fillStyle=d.live?LIVE:FIN; c.fillText(st,CX,cy+34);
        }else if(d.live||d.stale){
          c.direction='rtl'; c.font='900 34px '+FONT; c.fillStyle=d.live?LIVE:FIN;
          c.fillText(d.live?'مباشر':'—',CX,cy);
        }else{
          c.direction='rtl'; c.fillStyle=UP;
          c.fillText(fit(c,d.ko||'—','900',44,26,2*MIDW-8),CX,cy);
        }
        /* scorers under their own side */
        c.font='700 25px '+FONT; c.fillStyle=MUTED; c.direction='rtl'; c.textAlign='center';
        var half=(W-2*PAD)/2, gw=half-60;
        [[gLines(d.gh),CX+half/2],[gLines(d.ga),CX-half/2]].forEach(function(s){
          s[0].forEach(function(line,k){
            var t=line; while(t.length>4&&c.measureText(t).width>gw) t=t.slice(0,-1);
            c.fillText(t===line?t:t+'…',s[1],y+138+k*36);
          });
        });
        y+=h;
      });
    });
  }

  /* ---- a standings table: # · club · لعب ف ت خ +/- نقاط ---- */
  var TCOLS=['لعب','ف','ت','خ','+/-','نقاط'], TCW=84;
  function tcx(i){ return PAD+18+TCW/2+(TCOLS.length-1-i)*TCW; }   /* لعب on the right, نقاط on the left */
  function drawTable(info,pics){
    var rows=info.rows, RH=rows.length>12?60:70, TH=58, body=TH+rows.length*RH;
    frame(info,pics,body,1080,function(c,top){
      c.save(); rr(c,PAD,top,W-2*PAD,body,26); c.clip();
      c.fillStyle='#f1f5f9'; c.fillRect(PAD,top,W-2*PAD,TH);
      c.direction='rtl'; c.textAlign='center'; c.font='800 24px '+FONT; c.fillStyle=MUTED;
      TCOLS.forEach(function(t,i){ c.fillText(t,tcx(i),top+TH/2); });
      c.textAlign='right'; c.fillText('الفريق',W-PAD-88,top+TH/2);
      var nameR=W-PAD-88-RH*.72-14, nameW=nameR-(tcx(0)+TCW/2+8);
      rows.forEach(function(d,i){
        var y=top+TH+i*RH, cy=y+RH/2, CR=RH*.72;
        if(i%2){ c.fillStyle='#f8fafc'; c.fillRect(PAD,y,W-2*PAD,RH); }
        c.direction='ltr'; c.textAlign='center'; c.font='800 26px '+FONT; c.fillStyle=MUTED;
        c.fillText(d.pos,W-PAD-48,cy);
        var im=pics.crest[d.crest];
        if(im) contain(c,im,W-PAD-88-CR,cy-CR/2,CR);
        c.direction='rtl'; c.textAlign='right'; c.fillStyle=INK;
        c.fillText(fit(c,d.name,'800',30,20,nameW),nameR,cy);
        c.direction='ltr'; c.textAlign='center';
        d.n.forEach(function(v,k){
          var last=k===TCOLS.length-1;
          c.font=(last?'900 32px ':'700 27px ')+FONT; c.fillStyle=last?'#15658f':INK;
          c.fillText(v,tcx(k),cy);
        });
      });
      c.restore();
    });
  }

  /* ---- a scorers / assists chart: rank · face · name + club · number ---- */
  function drawChart(info,pics){
    var rows=info.rows, RH=96, TH=58, body=TH+rows.length*RH;
    frame(info,pics,body,1080,function(c,top){
      c.save(); rr(c,PAD,top,W-2*PAD,body,26); c.clip();
      c.fillStyle='#f1f5f9'; c.fillRect(PAD,top,W-2*PAD,TH);
      c.direction='rtl'; c.font='800 24px '+FONT; c.fillStyle=MUTED;
      c.textAlign='right';  c.fillText('اللاعب',W-PAD-96,top+TH/2);
      c.textAlign='center'; c.fillText(info.unit,PAD+90,top+TH/2);
      rows.forEach(function(d,i){
        var y=top+TH+i*RH, cy=y+RH/2, F=66, fx=W-PAD-96-F;
        if(i===0){ c.fillStyle='#f3f9fd'; c.fillRect(PAD,y,W-2*PAD,RH); }
        else{ c.fillStyle='#e6ebf1'; c.fillRect(PAD+24,y,W-2*PAD-48,2); }
        c.direction='ltr'; c.textAlign='center'; c.font='800 28px '+FONT; c.fillStyle=MUTED;
        c.fillText(d.pos,W-PAD-50,cy);
        var im=pics.crest[d.face];
        if(im&&d.round){                       /* a player photo: a circle, cropped to fill */
          c.save(); c.beginPath(); c.arc(fx+F/2,cy,F/2,0,6.2832); c.clip();
          c.fillStyle='#eef2f6'; c.fillRect(fx,cy-F/2,F,F);
          var k=Math.max(F/im.naturalWidth,F/im.naturalHeight), w=im.naturalWidth*k, h=im.naturalHeight*k;
          c.drawImage(im,fx+(F-w)/2,cy-F/2,w,h); c.restore();
        }else if(im) contain(c,im,fx+4,cy-F/2+4,F-8);
        else{ c.fillStyle='#e2e8f0'; c.beginPath(); c.arc(fx+F/2,cy,F/2-4,0,6.2832); c.fill(); }
        var nameR=fx-18, nameW=nameR-(PAD+170);
        c.direction='rtl'; c.textAlign='right'; c.fillStyle=INK;
        c.fillText(fit(c,d.name,'800',34,24,nameW),nameR,d.team?cy-17:cy);
        if(d.team){ c.fillStyle=MUTED; c.fillText(fit(c,d.team,'700',24,18,nameW),nameR,cy+22); }
        c.direction='ltr'; c.textAlign='center'; c.fillStyle='#15658f';
        c.fillText(fit(c,d.val,'900',46,26,150),PAD+90,cy);
      });
      c.restore();
    });
  }

  /* ---- «توقعاتي»: the reader's picks for a round (2026-11-25) ----
     home on the right, away on the left like the site; the side he picked is
     dark with «✓ يفوز» under it and the other side is faded; a draw sits in
     the middle. Only the matches he picked are drawn. */
  function drawPicks(info,pics){
    var rows=info.rows, RH=128, body=rows.length*RH, CX=W/2;
    frame(info,pics,body,rows.length>6?1350:1080,function(c,top){
      rows.forEach(function(d,i){
        var y=top+i*RH, cy=y+RH/2, CREST=70, MIDW=64;
        if(i){ c.fillStyle='#e6ebf1'; c.fillRect(PAD+24,y,W-2*PAD-48,2); }
        var hx=CX+MIDW+14, ax=CX-MIDW-14-CREST, nameW=W-PAD-22-(hx+CREST+16);
        [[d.hc,hx,d.v==='h',d.h,'left',hx+CREST+16],[d.ac,ax,d.v==='a',d.a,'right',ax-16]].forEach(function(s){
          var win=s[2], lost=d.v!=='d'&&!win, im=pics.crest[s[0]];
          c.globalAlpha=lost?.4:1;
          if(im) contain(c,im,s[1],cy-CREST/2,CREST);
          else{ c.fillStyle='#e2e8f0'; c.beginPath(); c.arc(s[1]+CREST/2,cy,CREST/2-4,0,6.2832); c.fill(); }
          c.direction='rtl'; c.textAlign=s[4]; c.fillStyle=INK;
          c.fillText(fit(c,s[3],win?'900':'800',36,22,nameW),s[5],win?cy-18:cy);
          c.globalAlpha=1;
          if(win){ c.font='800 24px '+FONT; c.fillStyle='#15803d'; c.fillText('✓ يفوز',s[5],cy+24); }
        });
        c.direction='rtl'; c.textAlign='center';
        if(d.v==='d'){
          c.fillStyle='#15658f'; rr(c,CX-MIDW+6,cy-27,2*MIDW-12,54,27); c.fill();
          c.font='900 28px '+FONT; c.fillStyle='#fff'; c.fillText('تعادل',CX,cy+1);
        }else{ c.font='800 30px '+FONT; c.fillStyle='#cbd5e1'; c.fillText('×',CX,cy); }
      });
    });
  }

  /* ---- «نتيجة توقعاتي»: his picks beside the final scores (2026-11-25) ----
     the real score in the middle (home on the right), a green row for a pick
     that came true and a red one for a miss, «توقعي» under the side he
     picked - or under the score when he picked the draw. */
  function drawResult(info,pics){
    var rows=info.rows, RH=128, body=rows.length*RH, CX=W/2;
    frame(info,pics,body,rows.length>6?1350:1080,function(c,top){
      c.save(); rr(c,PAD,top,W-2*PAD,body,26); c.clip();
      rows.forEach(function(d,i){
        var y=top+i*RH, cy=y+RH/2, CREST=70, MIDW=78;
        c.fillStyle=d.ok?'#ecfdf3':'#fef2f2'; c.fillRect(PAD,y,W-2*PAD,RH);
        if(i){ c.fillStyle='#fff'; c.fillRect(PAD,y,W-2*PAD,3); }
        var hx=CX+MIDW+14, ax=CX-MIDW-14-CREST, nameW=W-PAD-22-(hx+CREST+16);
        var tag=(d.ok?'✓':'✗')+' توقعي', col=d.ok?'#15803d':'#b91c1c';
        [[d.hc,hx,d.v==='h',d.h,'left',hx+CREST+16],[d.ac,ax,d.v==='a',d.a,'right',ax-16]].forEach(function(s){
          var im=pics.crest[s[0]];
          if(im) contain(c,im,s[1],cy-CREST/2,CREST);
          else{ c.fillStyle='#e2e8f0'; c.beginPath(); c.arc(s[1]+CREST/2,cy,CREST/2-4,0,6.2832); c.fill(); }
          c.direction='rtl'; c.textAlign=s[4]; c.fillStyle=INK;
          c.fillText(fit(c,s[3],'800',36,22,nameW),s[5],s[2]?cy-18:cy);
          if(s[2]){ c.font='800 24px '+FONT; c.fillStyle=col; c.fillText(tag,s[5],cy+24); }
        });
        var sy=d.v==='d'?cy-16:cy;
        c.direction='ltr'; c.font='900 50px '+FONT; c.fillStyle=INK; c.textAlign='center';
        c.fillText('-',CX,sy-3);
        c.textAlign='left';  c.fillText(d.hs,CX+22,sy);        /* home = right */
        c.textAlign='right'; c.fillText(d.as,CX-22,sy);
        if(d.v==='d'){ c.direction='rtl'; c.textAlign='center'; c.font='800 22px '+FONT; c.fillStyle=col; c.fillText(tag+': تعادل',CX,cy+32); }
      });
      c.restore();
    });
  }

  /* ---- the preview: the image + share / download ---- */
  var box, blobNow, nameNow;
  function ui(){
    if(box) return box;
    box=document.createElement('div'); box.className='shot-box'; box.hidden=true;
    box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true'); box.setAttribute('aria-label','صورة للمشاركة');
    box.innerHTML='<div class="shot-in"><img class="shot-img" alt="صورة للمشاركة">'
      +'<div class="shot-acts"><button type="button" class="shot-b shot-share">مشاركة</button>'
      +'<a class="shot-b shot-dl" download>تنزيل الصورة</a>'
      +'<button type="button" class="shot-b shot-x">إغلاق</button></div></div>';
    document.body.appendChild(box);
    box.addEventListener('click',function(e){ if(e.target===box||e.target.classList.contains('shot-x')) close(); });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!box.hidden) close(); });
    box.querySelector('.shot-share').addEventListener('click',function(){
      var f=file(); if(!f) return;
      navigator.share({files:[f]}).catch(function(){});
    });
    return box;
  }
  function file(){ try{ return blobNow?new File([blobNow],nameNow,{type:'image/png'}):null; }catch(e){ return null; } }
  function close(){
    box.hidden=true;
    var im=box.querySelector('.shot-img'); if(im.src){ URL.revokeObjectURL(im.src); im.removeAttribute('src'); }
  }
  function open(blob,name){
    var b=ui(); blobNow=blob; nameNow=name;
    var u=URL.createObjectURL(blob);
    b.querySelector('.shot-img').src=u;
    var dl=b.querySelector('.shot-dl'); dl.href=u; dl.setAttribute('download',name);
    var f=file(), can=false;
    try{ can=!!(f&&navigator.canShare&&navigator.canShare({files:[f]})); }catch(e){}
    b.querySelector('.shot-share').hidden=!can;
    b.hidden=false;
  }

  /* what the button stands on -> {info, icon, urls, draw, name} */
  function jobMatches(btn){
    var comp=btn.closest('.comp'), sec=btn.closest('.day'); if(!comp) return null;
    var rows=[].slice.call(comp.querySelectorAll('.mrow'))
      .filter(function(r){ return r.style.display!=='none'; }).map(rowData);
    if(!rows.length) return null;
    var ic=comp.querySelector('.comp-h img'), urls=[];
    rows.forEach(function(d){ urls.push(d.hc,d.ac); });
    return {info:{label:comp.getAttribute('data-label')||'', day:txt(sec&&sec.querySelector('.day-h')),
                  rows:rows, live:rows.some(function(d){return d.live;})},
            icon:ic?ic.getAttribute('src'):'', urls:urls, draw:drawMatches,
            name:'elgoon-'+(sec?sec.getAttribute('data-day'):'matches')+'.png'};
  }
  function iconOf(label){                     /* the league's emblem, from a table of it on the page */
    var t=[].slice.call(document.querySelectorAll('.ltable')).filter(function(x){ return x.getAttribute('data-cl')===label; })[0];
    var i=t&&t.querySelector('.lt-head img'); return i?i.getAttribute('src'):'';
  }
  function jobTable(btn){
    var t=btn.closest('.ltable'); if(!t) return null;
    var rows=[].slice.call(t.querySelectorAll('tbody tr')).map(function(tr){
      var n=[].slice.call(tr.children).filter(function(td){
        return !/\blt-(pos|team|form)\b/.test(td.className); }).map(txt);
      var im=tr.querySelector('.lt-team img');
      /* the cells: لعب ف ت خ له عليه +/- نقاط -> the image leaves out له / عليه */
      return {pos:txt(tr.querySelector('.lt-pos')), name:txt(tr.querySelector('.lt-team bdi')),
              crest:im?im.getAttribute('src'):'', n:n.length===8?[n[0],n[1],n[2],n[3],n[6],n[7]]:[]};
    }).filter(function(d){ return d.name&&d.n.length; });
    if(!rows.length) return null;
    var hd=t.querySelector('.lt-head').cloneNode(true);
    [].forEach.call(hd.querySelectorAll('button,.lt-past'),function(x){ x.remove(); });
    var label=t.getAttribute('data-cl')||'', title=txt(hd);
    var past=txt(t.querySelector('.lt-past'));
    var what=(!title||title.indexOf(label)>=0)?'جدول الترتيب':title;      /* «المجموعة أ» keeps its own name */
    var ic=t.querySelector('.lt-head img');
    return {info:{label:label, day:what+' · '+(past||today()), rows:rows, live:false},
            icon:ic?ic.getAttribute('src'):'', urls:rows.map(function(d){return d.crest;}),
            draw:drawTable, name:'elgoon-table.png'};
  }
  function jobChart(btn){
    var l=btn._list||btn.closest('.sc-list'); if(!l) return null;
    var rows=[].slice.call(l.querySelectorAll('.sc-row')).filter(function(r){ return r.offsetParent!==null; })
      .slice(0,15).map(function(r){
        var im=r.querySelector('.sc-p img');
        return {pos:txt(r.querySelector('.sc-n')), name:txt(r.querySelector('.sc-nm>bdi')),
                team:txt(r.querySelector('.sc-club')), val:txt(r.querySelector('.sc-g')),
                face:im?im.getAttribute('src'):'', round:!!(im&&im.classList.contains('sc-face'))};
      }).filter(function(d){ return d.name; });
    if(!rows.length) return null;
    var asst=btn.getAttribute('data-u')==='a', label=btn.getAttribute('data-cl')||'';
    return {info:{label:label, day:(asst?'صناعة الأهداف':'الهدافون')+' · '+today(), rows:rows, live:false,
                  unit:asst?'صناعة':'أهداف'},
            icon:iconOf(label), urls:rows.map(function(d){return d.face;}),
            draw:drawChart, name:asst?'elgoon-assists.png':'elgoon-scorers.png'};
  }

  /* ---- «أرقام قبل / بعد المباراة» of one match (2026-11-26) ----
     the section itself says what to draw (its data- attributes and its
     sentences): the two sides with the home one on the right, the kick-off
     or the score between them, then one sentence a row. */
  function wrapLines(c,s,font,maxW){
    c.font=font;
    var out=[], cur='';
    s.split(/\s+/).forEach(function(w){
      var n=cur?cur+' '+w:w;
      if(cur&&c.measureText(n).width>maxW){ out.push(cur); cur=w; } else cur=n;
    });
    if(cur) out.push(cur);
    return out;
  }
  function drawFacts(info,pics){
    var TOPH=250, LH=50, FP=26, FF='700 34px '+FONT, TW=W-2*PAD-2*36-22;
    var c0=cv.getContext('2d'); c0.direction='rtl';
    var blocks=info.facts.map(function(s){ return wrapLines(c0,s,FF,TW); });
    var body=TOPH+blocks.reduce(function(a,b){ return a+b.length*LH+2*FP; },0)+10;
    frame(info,pics,body,1080,function(c,top){
      var cy=top+112, hx=W-PAD-120, ax=PAD+120, S=120;
      [[hx,info.hc,info.h],[ax,info.ac,info.a]].forEach(function(t){
        var im=pics.crest[t[1]];
        if(im) contain(c,im,t[0]-S/2,cy-S/2-18,S);
        else{ c.fillStyle='#e2e8f0'; c.beginPath(); c.arc(t[0],cy-18,S/2-6,0,6.2832); c.fill(); }
        c.direction='rtl'; c.textAlign='center'; c.fillStyle=INK;
        c.fillText(fit(c,t[2],'800',30,20,300),t[0],cy+72);
      });
      c.direction='ltr'; c.textAlign='center'; c.fillStyle='#15658f'; c.font='900 78px '+FONT;
      c.fillText(info.mid,W/2,cy-18);                 /* a score comes with the home goals on the right */
      if(info.sub){ c.direction='rtl'; c.fillStyle=MUTED; c.font='700 24px '+FONT; c.fillText(info.sub,W/2,cy+44); }
      var y=top+TOPH;
      blocks.forEach(function(b){
        var h=b.length*LH+2*FP;
        c.fillStyle='#e6ebf1'; c.fillRect(PAD+24,y,W-2*PAD-48,2);
        c.fillStyle='#1676ad'; rr(c,W-PAD-36-8,y+FP,8,h-2*FP,4); c.fill();
        c.direction='rtl'; c.textAlign='right'; c.fillStyle=INK; c.font=FF;
        b.forEach(function(l,i){ c.fillText(l,W-PAD-36-22,y+FP+LH/2+i*LH); });
        y+=h;
      });
    });
  }
  function jobFacts(btn){
    var s=btn.closest('.pf'); if(!s) return null;
    var facts=[].slice.call(s.querySelectorAll('.pf-l li')).map(txt).filter(Boolean).slice(0,6);
    if(!facts.length) return null;
    var g=function(k){ return s.getAttribute('data-'+k)||''; };
    return {info:{label:g('t'), day:g('comp'), h:g('h'), a:g('a'), hc:g('hc'), ac:g('ac'),
                  mid:g('mid'), sub:g('sub'), facts:facts, live:false},
            icon:iconOf(g('comp')), urls:[g('hc'),g('ac')], draw:drawFacts, name:'elgoon-facts.png'};
  }

  /* «كام واحد ضغط؟» (2026-11-25): one count per use of a button - the
     button's name and nothing about the reader, his picks or the page
     (worker.js countEvent adds one to a number for the day) */
  function hit(n){
    try{
      if(navigator.sendBeacon) navigator.sendBeacon('/e/'+n);
      else if(window.fetch) fetch('/e/'+n,{method:'POST',keepalive:true}).catch(function(){});
    }catch(e){}
  }
  function shoot(btn){
    var k=btn.getAttribute('data-shot');
    var job=k==='t'?jobTable(btn):(k==='s'?jobChart(btn):(k==='f'?jobFacts(btn):jobMatches(btn)));
    if(job) job.ev='shot_img';
    run(btn,job);
  }
  function run(btn,job,then){
    if(!job) return;
    var seen={}, keys=job.urls.filter(function(u){ if(!u||seen[u]) return false; seen[u]=1; return true; });
    btn.disabled=true;
    var fonts=(document.fonts&&document.fonts.load)
      ?Promise.all(['700','800','900'].map(function(w){ return document.fonts.load(w+' 40px Almarai','الجون 0'); })).catch(function(){})
      :Promise.resolve();
    Promise.all([fonts, img(job.icon), img('/assets/logo.png'),
                 Promise.all(keys.map(img))]).then(function(r){
      var crest={}; keys.forEach(function(u,i){ crest[u]=r[3][i]; });
      job.draw(job.info,{icon:r[1],logo:r[2],crest:crest});
      cv.toBlob(function(blob){
        btn.disabled=false;
        if(blob){ if(then) then(); open(blob,job.name); if(job.ev) hit(job.ev); }
      },'image/png');
    }).catch(function(){ btn.disabled=false; });
  }
  /* ---- «توقّع وشارك»: the sheet (site_lib/pick.py says what it lists) ----
     data-pick="<slug>" = the league's round from /pick/<slug>.json; without
     it (a cup, the national teams) = that day's open rows on screen. Every
     name is written with textContent. The picks stay in this browser. */
  var PKEY='elgoonPick', picks={}, sheet, cur;
  try{ picks=JSON.parse(localStorage.getItem(PKEY)||'{}')||{}; }catch(e){ picks={}; }
  function keep(){
    try{
      var ks=Object.keys(picks); if(ks.length>400) ks.slice(0,ks.length-300).forEach(function(k){ delete picks[k]; });
      localStorage.setItem(PKEY,JSON.stringify(picks));
    }catch(e){}
  }
  function mk(tag,cls,t){ var e=document.createElement(tag); if(cls) e.className=cls; if(t!=null) e.textContent=t; return e; }
  function fromRows(comp,day){
    return [].slice.call(comp.querySelectorAll('.mrow')).filter(function(r){
      return r.style.display!=='none'&&!r.classList.contains('mrow-live')&&!r.classList.contains('mrow-fin');
    }).map(function(r){
      var d=rowData(r);
      return {id:'d:'+day+':'+d.h+':'+d.a, h:d.h, a:d.a, hc:d.hc, ac:d.ac, w:d.ko, done:d.hs!==null||d.stale};
    }).filter(function(m){ return m.h&&m.a&&!m.done; });
  }
  function sheetUI(){
    if(sheet) return sheet;
    sheet=mk('div','pick-box'); sheet.hidden=true;
    sheet.setAttribute('role','dialog'); sheet.setAttribute('aria-modal','true'); sheet.setAttribute('aria-label','توقّع وشارك');
    var inn=mk('div','pick-in'), hd=mk('div','pick-hd'), tt=mk('div'), x=mk('button','pick-x','×');
    x.type='button'; x.setAttribute('aria-label','إغلاق');
    tt.appendChild(mk('h2','pick-t')); tt.appendChild(mk('p','pick-s'));
    hd.appendChild(tt); hd.appendChild(x);
    var ft=mk('div','pick-ft'), go=mk('button','pick-go','أنشئ صورة توقعاتي'); go.type='button';
    ft.appendChild(mk('span','pick-n')); ft.appendChild(go);
    inn.appendChild(hd); inn.appendChild(mk('div','pick-ls')); inn.appendChild(ft); sheet.appendChild(inn);
    document.body.appendChild(sheet);
    function shut(){ sheet.hidden=true; }
    x.addEventListener('click',shut);
    sheet.addEventListener('click',function(e){ if(e.target===sheet) shut(); });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!sheet.hidden) shut(); });
    go.addEventListener('click',function(){
      if(!cur) return;
      var rows=cur.ms.filter(function(m){ return picks[m.id]; }).map(function(m){
        return {h:m.h, a:m.a, hc:m.hc, ac:m.ac, v:picks[m.id]}; });
      if(!rows.length) return;
      var urls=[]; rows.forEach(function(d){ urls.push(d.hc,d.ac); });
      run(go,{info:{label:cur.label, day:'توقعاتي · '+cur.what, rows:rows, live:false},
              icon:cur.icon, urls:urls, draw:drawPicks, name:'elgoon-picks.png', ev:'pick_img'});   /* the sheet stays: he may change a pick */
    });
    return sheet;
  }
  function sheetDraw(){
    var s=sheetUI(), ls=s.querySelector('.pick-ls'), n=0;
    s.querySelector('.pick-t').textContent='توقّع '+cur.what;
    s.querySelector('.pick-s').textContent=cur.label+' · اضغط على الفريق الذي تتوقع فوزه، أو «تعادل».';
    ls.textContent='';
    cur.ms.forEach(function(m){
      var v=picks[m.id], row=mk('div','pick-m'), bs=mk('div','pick-bs');
      if(v) n++;
      if(m.w) row.appendChild(mk('p','pick-w',m.w));
      bs.setAttribute('role','group'); bs.setAttribute('aria-label',m.h+' و'+m.a);
      [['h',m.h,m.hc,'فوز '+m.h],['d','تعادل','','تعادل'],['a',m.a,m.ac,'فوز '+m.a]].forEach(function(o){
        var b=mk('button','pick-b'+(v===o[0]?' on':'')); b.type='button';
        b.setAttribute('aria-label',o[3]); b.setAttribute('aria-pressed',v===o[0]?'true':'false');
        if(o[2]&&sameOrigin(o[2])){ var i=document.createElement('img'); i.src=o[2]; i.alt=''; i.width=22; i.height=22; b.appendChild(i); }
        b.appendChild(mk('span','',o[1]));
        b.addEventListener('click',function(){
          if(picks[m.id]===o[0]) delete picks[m.id]; else picks[m.id]=o[0];
          keep(); var top=ls.scrollTop; sheetDraw(); ls.scrollTop=top;
        });
        bs.appendChild(b);
      });
      row.appendChild(bs); ls.appendChild(row);
    });
    s.querySelector('.pick-n').textContent=n?('اخترت '+n+' من '+cur.ms.length):'لم تختر أي نتيجة بعد';
    s.querySelector('.pick-go').disabled=!n;
  }
  function pickOpen(btn){
    var comp=btn.closest('.comp'), sec=btn.closest('.day'); if(!comp) return;
    var ic=comp.querySelector('.comp-h img'), slug=btn.getAttribute('data-pick')||'';
    var base={label:comp.getAttribute('data-label')||'', icon:ic?ic.getAttribute('src'):''};
    function show(what,ms){
      btn.disabled=false;
      if(!ms.length) return;
      cur={label:base.label, icon:base.icon, what:what, ms:ms};
      sheetDraw(); sheetUI().hidden=false;
    }
    function day(){ show('مباريات '+(txt(sec&&sec.querySelector('.day-h'))||'اليوم'), fromRows(comp,sec?sec.getAttribute('data-day'):'')); }
    if(!/^[a-z0-9-]{1,40}$/.test(slug)||!window.fetch) return day();
    btn.disabled=true;
    fetch('/pick/'+slug+'.json').then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(d){
      var ms=(d&&d.m||[]).filter(function(m){ return m&&m.id&&m.h&&m.a; }).map(function(m){
        return {id:'r:'+m.id, h:String(m.h), a:String(m.a), hc:String(m.hc||''), ac:String(m.ac||''), w:String(m.w||'')}; });
      if(!ms.length) throw 0;
      show('الجولة '+parseInt(d.r,10), ms);
    }).catch(day);
  }

  /* for a page that holds its own data (/calc/<slug>): the same two images */
  window.elgoonShot={
    picks:function(btn,o){
      var u=[]; o.rows.forEach(function(d){ u.push(d.hc,d.ac); });
      run(btn,{info:{label:o.label, day:'توقعاتي · '+o.what, rows:o.rows, live:false}, icon:o.icon, urls:u, draw:drawPicks, name:'elgoon-picks.png', ev:'pick_img'});
    },
    table:function(btn,o){
      run(btn,{info:{label:o.label, day:o.what+' · '+today(), rows:o.rows, live:false}, icon:o.icon,
               urls:o.rows.map(function(d){ return d.crest; }), draw:drawTable, name:'elgoon-table.png', ev:'table_img'});
    },
    result:function(btn,o){
      var u=[]; o.rows.forEach(function(d){ u.push(d.hc,d.ac); });
      run(btn,{info:{label:o.label, day:'نتيجة توقعاتي · '+o.what, rows:o.rows, live:false}, icon:o.icon, urls:u,
               draw:drawResult, name:'elgoon-result.png', ev:'result_img'});
    }
  };

  /* a chart's button sits on the heading above the chart, at its far end
     (user, 2026-11-25: «عايزه يظهر على الشمال جنب كلمة ترتيب الهدافين»).
     The chart has no heading of its own, so the button is moved up to the
     one before it; a chart with no heading keeps it in its own first row. */
  [].forEach.call(document.querySelectorAll('.sc-hd .comp-shot'),function(b){
    var l=b.closest('.sc-list'), h=l&&l.previousElementSibling;
    if(!h||!/^H[1-4]$/.test(h.tagName)) return;
    b._list=l; h.classList.add('shot-h'); h.appendChild(b);
  });
  /* delegated: day fragments fetched later carry the same button */
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('.comp-shot');
    if(b){ e.preventDefault(); e.stopPropagation(); shoot(b); return; }
    b=e.target.closest&&e.target.closest('.comp-pick');
    if(b) hit('pick_open');
    if(b&&b.tagName!=='A'){ e.preventDefault(); e.stopPropagation(); pickOpen(b); }   /* a link = the league's own page */
  });
})();
</script>
