<script>
(function(){
  /* the LIVE scorers and assists charts (2026-11-14, user: «خلى الهدافين
     لحظيين كمان»). Each chart is the 365scores list as of the site's last
     build; the goals of the competition's live matches (the reply LIVE_JS
     polls, 'lv:update') are added to the players already on it, the list
     re-ordered, and «+1» marks a live addition.
     NEVER COUNT A GOAL TWICE: whether a goal scored before the chart was
     taken is already in it cannot be known, so only goals scored AFTER the
     page was built (data-at, a moment after the chart snapshot) are added,
     timed from the match minute (a first-half goal seen in the second half
     also crosses the break). At worst a goal shows at the next build, never
     twice. Own goals never count for the scorer. A player not on the list is
     left out (his earlier total is unknown). Goals this page has counted
     stay counted after the whistle until the page is reloaded. */
  function norm(s){return(s||'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[.'’]/g,'').replace(/\s+/g,'');}
  function txt(e){return e?(e.textContent||'').trim():'';}
  var MEM={};   /* "gameId|kind|player|minute" -> {cid,k,n,t} counted once */
  function minuteOf(m){var p=String(m||'').replace(/[^0-9+]/g,'').split('+');return [parseInt(p[0],10)||0,parseInt(p[1],10)||0];}
  function remember(){
    var gs=window.__lvGames||[], at=window.__lvAt||Date.now(), now=Date.now();
    gs.forEach(function(g){
      if(!g.live||!(g.gt>0)||!g.goals) return;
      var cur=g.gt+(now-at)/60000;
      g.goals.forEach(function(x){
        var mm=minuteOf(x.m), gm=mm[0]+mm[1]; if(!mm[0]) return;
        /* how long ago, in real time: minutes of play since, + the break */
        var ago=Math.max(0,cur-gm)+((g.hf===2&&mm[0]<=45)?15:0);
        var when=now-ago*60000;
        var team=x.s==='h'?g.h:g.a;
        if(x.p&&x.t!=='عكسية') MEM[g.id+'|g|'+x.p+'|'+x.m]={cid:String(g.c),k:'g',n:norm(x.p),t:norm(team),w:when};
        if(x.a) MEM[g.id+'|a|'+x.a+'|'+x.m]={cid:String(g.c),k:'a',n:norm(x.a),t:norm(team),w:when};
      });
    });
  }
  function apply(list){
    var cid=list.getAttribute('data-cid'),k=list.getAttribute('data-k'),at=+list.getAttribute('data-at')||0;
    if(!cid||!k||!at) return;
    if(!list.__ls){
      list.__ls=[].slice.call(list.querySelectorAll('.sc-row[data-n]')).map(function(r,i){
        var g=r.querySelector('.sc-g');
        return {r:r,i:i,n:norm(r.getAttribute('data-n')),t:norm(r.getAttribute('data-t')),
                v:parseInt(txt(g),10)||0,g:g,html:g.innerHTML,num:r.querySelector('.sc-n')};
      });
      list.__sig='';
    }
    var L=list.__ls, add={};
    /* a margin of two minutes after the build: the minute is an estimate */
    Object.keys(MEM).forEach(function(key){
      var e=MEM[key]; if(e.cid!==cid||e.k!==k||e.w<at+120000) return;
      L.forEach(function(x){ if(x.n===e.n&&(!x.t||!e.t||x.t===e.t)) add[x.i]=(add[x.i]||0)+1; });
    });
    var sig=JSON.stringify(add); if(sig===list.__sig) return; list.__sig=sig;
    var rows=L.map(function(x){return {x:x,v:x.v+(add[x.i]||0),d:add[x.i]||0};});
    rows.sort(function(a,b){return b.v-a.v||a.x.i-b.x.i;});
    rows.forEach(function(y,j){
      if(y.x.num) y.x.num.textContent=String(j+1);
      if(y.d) y.x.g.innerHTML=String(y.v)+'<i class="sc-lvp">+'+y.d+'</i>';
      else y.x.g.innerHTML=y.x.html;
      y.x.r.classList.toggle('sc-lv',!!y.d);
      y.x.r.parentNode.appendChild(y.x.r);
    });
  }
  document.addEventListener('lv:update',function(){
    remember();
    [].forEach.call(document.querySelectorAll('.sc-list[data-cid]'),apply);
  });
})();
</script>
