<script>
(function(){
  /* /standings/<slug>: «لعب / ف / ت / خ» open the team's matches (user,
     2026-11-01). The table row carries data-gm="id:w,id:l,..." (kick-off
     order) and the matches sit once each in .lt-games; this clones them into
     one popup, newest first. Escape, the × and the backdrop close it. */
  var store=document.querySelector('.lt-games'); if(!store) return;
  var byId={}, ready=null;
  function index(){ [].forEach.call(store.children,function(e){ byId[e.getAttribute('data-id')]=e; }); }
  index();
  /* a match page ships the table without the store (2026-11-07): it is the
     standings page's, and data-src says which - fetched on the first tap.
     The live site serves the extensionless path; a plain file server only
     the .html, so both are tried. */
  function load(){
    var src=store.getAttribute('data-src');
    if(!src||store.children.length) return Promise.resolve();
    if(ready) return ready;
    function get(u){ return fetch(u,{credentials:'same-origin'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); }); }
    ready=get(src).catch(function(){ return get(src+'.html'); }).then(function(html){
      var s=new DOMParser().parseFromString(html,'text/html').querySelector('.lt-games');
      if(!s) throw new Error('no store');
      while(s.firstChild) store.appendChild(s.firstChild);
      index();
    }).catch(function(e){ ready=null; throw e; });
    return ready;
  }
  var LBL={p:'كل المباريات',w:'الفوز',d:'التعادل',l:'الخسارة'};
  var pop=document.createElement('div');
  pop.className='lt-pop'; pop.hidden=true;
  pop.innerHTML='<div class="lt-pop-box" role="dialog" aria-modal="true">'
    +'<div class="lt-pop-h"><b></b><button type="button" class="lt-pop-x" aria-label="إغلاق">×</button></div>'
    +'<div class="lt-pop-l"></div></div>';
  document.body.appendChild(pop);
  var last=null;
  function close(){ pop.hidden=true; document.documentElement.classList.remove('lt-lock'); if(last) last.focus(); }
  pop.addEventListener('click',function(e){
    if(e.target===pop||e.target.closest('.lt-pop-x')) close();
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!pop.hidden) close(); });
  document.addEventListener('click',function(e){
    var b=e.target.closest('.lt-n'); if(!b) return;
    load().then(function(){ show(b); }, function(){
      pop.querySelector('b').textContent='تعذّر تحميل المباريات - حاول مرة أخرى';
      pop.querySelector('.lt-pop-l').innerHTML='';
      last=b; pop.hidden=false; document.documentElement.classList.add('lt-lock');
      pop.querySelector('.lt-pop-x').focus();
    });
  });
  function show(b){
    var tr=b.closest('tr'), k=b.getAttribute('data-k');
    var items=(tr.getAttribute('data-gm')||'').split(',').filter(Boolean)
      .map(function(x){ return x.split(':'); })
      .filter(function(x){ return k==='p'||x[1]===k; });
    var list=pop.querySelector('.lt-pop-l'); list.innerHTML='';
    items.slice().reverse().forEach(function(x){
      var el=byId[x[0]]; if(!el) return;
      var c=el.cloneNode(true); c.classList.add('r-'+x[1]); list.appendChild(c);
    });
    pop.querySelector('b').textContent=tr.getAttribute('data-tn')+' — '+LBL[k]+' ('+items.length+')';
    last=b; pop.hidden=false; document.documentElement.classList.add('lt-lock');
    pop.querySelector('.lt-pop-x').focus();
  }
})();
</script>
