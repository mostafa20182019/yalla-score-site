# Cloudflare deploy config for the Yalla Score static site.
# `wrangler deploy` (run from this folder) uploads ./dist to the existing
# Cloudflare Workers project so the public URL stays the same.
#
# worker.js adds a scheduled handler: Cloudflare cron (exact) dispatches the
# GitHub Action every 30 min so the site data stays fresh (GitHub's own free
# cron is best-effort and often hours late). Static requests are still served
# straight from assets (run_worker_first defaults to false).
name = "old-credit-e926"
main = "worker.js"
compatibility_date = "2025-06-01"
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
# run the Worker before asset serving so the legacy-host 301 redirect in
# worker.js applies to EVERY path (assets included), not just misses
run_worker_first = true
# a missing asset serves dist/404.html (status 404) instead of a bare
# Cloudflare error - the page itself auto-retries (see build_site.py)
not_found_handling = "404-page"

[triggers]
# cron 1: data refresh every 15 min (dispatches publish.yml)
# cron 2: the 10 daily-article slots, Cairo 9,11,13,15,17,18,20,21,22,23
#         (dispatches daily-article.yml) — restored to 10/day 2026-09-01
#         (was cut to 5 on 2026-08-26). GitHub's own schedule trigger
#         skipped slots outright, so the exact CF cron is the article
#         trigger; worker.js routes by event.cron — the string there MUST
#         match cron 2 EXACTLY or every firing dispatches publish.yml.
crons = ["1,16,31,46 * * * *", "0 6,8,10,12,14,15,17,18,19,20 * * *"]
