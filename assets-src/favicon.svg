<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512">
  <!-- OUR ball, edge to edge. It is the same ball as app-icon-1024.png and the
       header: a WHITE ball with dark navy panels. The previous icon had it
       inverted (a solid blue disc with white panels), which read as a blue blob
       at tab size and did not look like the ball anywhere else on the site.

       The ball IS the canvas - radius 64 on a 128 box, no padding. Google draws
       a favicon on white, so the brand-blue rim is not decoration: without it a
       white ball has no outline at all. Pentagon and spokes are sized to still
       read at 16px, which is where a favicon actually lives.

       The PNG and ICO are generated, not exported from here - there is no SVG
       renderer on this machine. See the generator in the commit that added
       this; it draws the same geometry with Pillow at 8x and downsamples. -->
  <circle cx="64" cy="64" r="64" fill="#ffffff"/>
  <g stroke="#13293d" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="64.00" y1="30.00" x2="64.00"  y2="8.00"/>
    <line x1="96.34" y1="53.49" x2="117.26" y2="46.70"/>
    <line x1="83.99" y1="91.51" x2="96.92"  y2="109.30"/>
    <line x1="44.01" y1="91.51" x2="31.08"  y2="109.30"/>
    <line x1="31.66" y1="53.49" x2="10.74"  y2="46.70"/>
  </g>
  <polygon points="64.00,30.00 96.34,53.49 83.99,91.51 44.01,91.51 31.66,53.49"
           fill="#13293d"/>
  <circle cx="64" cy="64" r="62" fill="none" stroke="#1f94d3" stroke-width="5"/>
</svg>
