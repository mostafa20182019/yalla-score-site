    <circle cx="0" cy="-2" r="2.4" fill="#1d7a3c"/>
    <path d="M-4,2 L-9,8 L-4,7 Z" fill="#ffffff"/>
    <path d="M4,2 L9,8 L4,7 Z" fill="#ffffff"/>
    <line x1="0" y1="7" x2="0" y2="11" fill="none"/>
