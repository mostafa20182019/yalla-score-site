<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d7a3c"/>
      <stop offset="1" stop-color="#0d5226"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#g)"/>
  <!-- mown stripes -->
  <g fill="#ffffff" opacity="0.05">
    <rect x="0" width="50" height="225"/><rect x="100" width="50" height="225"/>
    <rect x="200" width="50" height="225"/><rect x="300" width="50" height="225"/>
  </g>
  <!-- pitch markings -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.6">
    <rect x="18" y="14" width="364" height="197" rx="2"/>
    <line x1="200" y1="14" x2="200" y2="211"/>
    <circle cx="200" cy="112" r="34"/>
    <rect x="18" y="62" width="52" height="101"/>
    <rect x="330" y="62" width="52" height="101"/>
  </g>
  <circle cx="200" cy="112" r="4" fill="#ffffff" opacity="0.6"/>
  <!-- Yalla Score badge -->
  <g transform="translate(200,112)">
    <rect x="-62" y="-20" width="124" height="40" rx="20" fill="#0a3d1c" opacity="0.78"/>
    <!-- rocket -->
    <g transform="translate(-40,0)" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0,-11 C4.5,-6.5 5.5,0.5 4,7 L-4,7 C-5.5,0.5 -4.5,-6.5 0,-11 Z" fill="#ffffff" fill-opacity="0.92"/>
      <circle cx="0" cy="-2" r="2.4" fill="#1d7a3c" stroke="none"/>
      <path d="M-4,2 L-9,8 L-4,7 Z" fill="#ffffff" fill-opacity="0.92"/>
      <path d="M4,2 L9,8 L4,7 Z" fill="#ffffff" fill-opacity="0.92"/>
      <line x1="0" y1="7" x2="0" y2="11"/>
    </g>
    <text x="14" y="7" text-anchor="middle" direction="rtl"
          font-family="'Segoe UI',Tahoma,Arial,sans-serif" font-size="19" font-weight="700"
          fill="#ffffff">يلا سكور</text>
  </g>
